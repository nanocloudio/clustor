# Clustor — 2-replica single-partition test cluster (template).
#
# This file is a TEMPLATE: it contains `__SELF_ID__` and
# `__LISTEN_PORT__` placeholders that must be substituted per node
# before `fluxor run`. Render with:
#
#   fluxor up configs/multi-2node.yaml --replicas 2          # spawn both
#   fluxor render-template configs/multi-2node.yaml \
#       --var SELF_ID=0 --var LISTEN_PORT=9090 \
#       --var PEER0_PORT=9090 --var PEER1_PORT=9091 \
#       --var HTTP_PORT=19090 > /tmp/n0.yaml                  # one node
#
# Both replicas run on localhost. node 0 listens on 9090, node 1 on
# 9091. voter_count=2 means majority=2, so both nodes must agree to
# commit a proposal and to elect a leader; with either down, no
# progress is possible — that's the safety property the topology
# exists to verify.
#
# Validates peer connections, peer_router demux (peer_rx fans out to
# BOTH consensus and consensus), AppendEntries replication, and
# durability quorum across two replicas. Run from per-node working
# directories so `wal/` and `raft/` don't collide.

target: linux
tick_us: 1000

# Accept structural cycles. The clustor graph has a metrics fan-in
# (`consensus.metrics → operations.ingest`, `operations.export →
# gateway.metrics_data`) whose loop closes via
# `gateway.proposals_tagged → consensus.proposals_tagged` —
# a topological cycle but a semantic feedback edge — each
# step is single-pass and never re-enters the cycle within one tick.
# Without this the scheduler rejects the graph; see fluxor's
# `prepare_graph` and `scheduler.accept_cycles`.
scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: peer_router
    params:
      self_id: __SELF_ID__
      peer_count: 2
      listen_port: __LISTEN_PORT__
      peer0_port: __PEER0_PORT__
      peer1_port: __PEER1_PORT__

  - name: consensus
    params:
      self_id: __SELF_ID__
      voter_count: 2
      heartbeat_interval_ms: 150
      peer_count: 2
  - name: durability
    params:
      self_id: __SELF_ID__
      voter_count: 2
      partition_id: 0
  - name: control_plane
  - name: admission
  - name: operations
  - name: gateway
wiring:
  # ── Transport: linux_net ↔ peer_router ─────────────────────
  - from: linux_net.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: linux_net.net_in

  # ── Inbound peer traffic ───────────────────────────────────
  # peer_router demuxes the 5-byte partitioned wire envelope
  # (`[partition_id:u16 LE][msg_type:u8][len:u16 LE]`):
  #   MSG_APPEND_ENTRIES_RESP                           → peer_rx
  #   votes / heartbeats / AppendEntries / snapshot     → raft_rpc
  #   anything else from a peer (untrusted shape)       → drop
  # Non-Raft client traffic (HTTP admin) still routes through
  # `cleartext` → `gateway`, which dispatches by msg_type.
  - from: peer_router.peer_rx
    to: consensus.ack
  - from: peer_router.raft_rpc
    to: consensus.rpc

  # ── Outbound peer traffic ──────────────────────────────────
  - from: consensus.rpc_out
    to: peer_router.peer_tx
  - from: consensus.net_out
    to: peer_router.repl_tx

  # ── HTTP admin (clients reach the cluster via either node) ──
  - from: peer_router.cleartext
    to: gateway.requests
  - from: gateway.raft_rpc
    to: consensus.rpc
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: gateway.responses
    to: peer_router.client_resp

  # ── Raft pipeline ──────────────────────────────────────────
  - from: consensus.lag_signal
    to: admission.lag
  - from: consensus.log_append
    to: durability.entries
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water before proposal intake opens. Never multiplex this onto
  # wal.flushed, which also fans out durability acknowledgements.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  # Raft §5.3 conflict-repair: a leader-divergent follower truncates its WAL
  # suffix on this control edge (shares wal.compact_before; MSG_WAL_TRUNCATE_AFTER).
  - from: consensus.wal_compact
    to: durability.compact_before
  # Spec §10.4.1: every replica tracks its own `local_wal_durable_index`
  # in consensus so followers can stamp it into each AE response.
  - from: durability.flushed
    to: consensus.wal_flushed
  # Cross-node DurabilityAck fan-in (spec §10.4.1). Followers' durable
  # indices arrive embedded in AE responses; consensus synthesizes
  # MSG_FSYNC_ACK frames keyed by the follower's replica id so the
  # leader's durability can compute quorum-fsync.
  - from: consensus.cross_durability_ack
    to: durability.ack
  # Conflict-repair retry: consensus asks wal for a specific log
  # index, wal replies with the entry body so the consensus can
  # build a targeted AE for a lagging follower. See RFC §1.1.
  - from: consensus.entry_request
    to: durability.entry_request
  - from: durability.entry_reply
    to: consensus.entry_reply
  # consensus's gap-refetch shares the WAL's entry_request /
  # entry_reply ports with the consensus (requests fan in; replies
  # tee to both consumers, each matching on its own request ids /
  # indices and ignoring the rest). A restarted follower NEEDS this
  # path: its WAL replay restores the log — so raft log-matching
  # succeeds and the leader never re-ships those entries — and the
  # replayed bodies can only reach the apply pipeline by reading
  # them back from the local WAL.
  - from: durability.quorum_durable
    to: consensus.durable

  # ── Control plane ──────────────────────────────────────────
  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus.cp_state
  - from: admission.strict_fallback
    to: consensus.cp_state

  # ── Metrics ────────────────────────────────────────────────
  - from: consensus.metrics
    to: operations.ingest
  - from: durability.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.export
    to: gateway.metrics_data
