# Clustor — 2-replica 2-partition snapshot test cluster (template).
#
# This file is a TEMPLATE: substitute `__SELF_ID__` and
# `__LISTEN_PORT__` per node before `fluxor run`. Render with:
#
#   fluxor up configs/multi-2node-2p-snap.yaml --replicas 2  # spawn both
#   fluxor render-template configs/multi-2node-2p-snap.yaml \
#       --var SELF_ID=0 --var LISTEN_PORT=9090 \
#       --var PEER0_PORT=9090 --var PEER1_PORT=9091 \
#       --var HTTP_PORT=19090 > /tmp/n0.yaml                  # one node
#
# Like `multi-2node-2p.yaml` but adds a per-partition
# `durability` and lowers `wal.segment_bytes` so a small handful
# of proposals fills a segment, closes it, and emits
# `MSG_SNAPSHOT_TRIGGER` to its sibling durability — which then
# persists a manifest at the partition path.
#
#   partition 0 → wal/seg_*.bin and wal/snap_*.bin
#   partition 1 → wal/p0001/seg_*.bin and wal/p0001/snap_*.bin
#
# Snapshots are not yet wired to log compaction or follower
# InstallSnapshot — the manifest file is durable proof that the
# trigger fired and the partition reached the recorded term/index.

target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: peer_router
    params:
      self_id: __SELF_ID__
      peer_count: 2
      listen_port: __LISTEN_PORT__
      peer0_port: __PEER0_PORT__
      peer1_port: __PEER1_PORT__

  - name: gateway
    params:
      self_id: __SELF_ID__
  - name: partition_router
    params:
      num_partitions: 2

  # ── Partition 0 ───────────────────────────────────────────
  - name: consensus_p0
    type: consensus
    params:
      self_id: __SELF_ID__
      voter_count: 2
      heartbeat_interval_ms: 150
      partition_id: 0
      peer_count: 2
  - name: durability_p0
    type: durability
    params:
      self_id: __SELF_ID__
      voter_count: 2
      partition_id: 0

  # ── Partition 1 ───────────────────────────────────────────
  - name: consensus_p1
    type: consensus
    params:
      self_id: __SELF_ID__
      voter_count: 2
      heartbeat_interval_ms: 150
      partition_id: 1
      peer_count: 2
  - name: durability_p1
    type: durability
    params:
      self_id: __SELF_ID__
      voter_count: 2
      partition_id: 1

  # ── Shared substrate ──────────────────────────────────────
  - name: control_plane
  - name: admission
  - name: operations
wiring:
  - from: linux_net.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: linux_net.net_in

  - from: peer_router.peer_rx
    to: consensus_p0.ack
  - from: peer_router.peer_rx
    to: consensus_p1.ack
  - from: peer_router.raft_rpc
    to: consensus_p0.rpc
  - from: peer_router.raft_rpc
    to: consensus_p1.rpc

  - from: consensus_p0.rpc_out
    to: peer_router.peer_tx
  - from: consensus_p1.rpc_out
    to: peer_router.peer_tx
  - from: consensus_p0.net_out
    to: peer_router.repl_tx
  - from: consensus_p1.net_out
    to: peer_router.repl_tx

  - from: peer_router.cleartext
    to: gateway.requests
  - from: gateway.responses
    to: peer_router.client_resp

  - from: gateway.proposals_tagged
    to: partition_router.proposals_tagged
  - from: partition_router.proposals_tagged_p0
    to: consensus_p0.proposals_partitioned_tagged
  - from: partition_router.proposals_tagged_p1
    to: consensus_p1.proposals_partitioned_tagged
  - from: consensus_p0.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus_p1.proposal_assigned
    to: gateway.proposal_assigned

  # Per-partition pipelines (with snapshot trigger wiring).
  - from: consensus_p0.lag_signal
    to: admission.lag
  - from: consensus_p0.log_append
    to: durability_p0.entries
  # Raft §5.3 conflict-repair: a leader-divergent follower truncates its
  # WAL suffix on this control edge (shares wal.compact_before;
  # MSG_WAL_TRUNCATE_AFTER). Without it log repair cannot converge.
  - from: consensus_p0.wal_compact
    to: durability_p0.compact_before
  - from: durability_p0.flushed
    to: consensus_p0.wal_flushed
  # Gap refetch: a restarted follower's replayed entries reach the
  # apply pipeline only by reading them back from the local WAL
  # (raft log-matching means the leader never re-ships them).
  - from: consensus_p0.entry_request
    to: durability_p0.entry_request
  - from: durability_p0.entry_reply
    to: consensus_p0.entry_reply
    buffer_bytes: 8192
  - from: consensus_p0.cross_durability_ack
    to: durability_p0.ack
  - from: durability_p0.installed_local
    to: consensus_p0.snapshot_installed
  - from: durability_p0.quorum_durable
    to: consensus_p0.durable
  - from: consensus_p0.applied
    to: gateway.applied

  - from: consensus_p1.lag_signal
    to: admission.lag
  - from: consensus_p1.log_append
    to: durability_p1.entries
  # Raft §5.3 conflict-repair: a leader-divergent follower truncates its
  # WAL suffix on this control edge (shares wal.compact_before;
  # MSG_WAL_TRUNCATE_AFTER). Without it log repair cannot converge.
  - from: consensus_p1.wal_compact
    to: durability_p1.compact_before
  - from: durability_p1.flushed
    to: consensus_p1.wal_flushed
  # Gap refetch: a restarted follower's replayed entries reach the
  # apply pipeline only by reading them back from the local WAL
  # (raft log-matching means the leader never re-ships them).
  - from: consensus_p1.entry_request
    to: durability_p1.entry_request
  - from: durability_p1.entry_reply
    to: consensus_p1.entry_reply
    buffer_bytes: 8192
  - from: consensus_p1.cross_durability_ack
    to: durability_p1.ack
  - from: durability_p1.installed_local
    to: consensus_p1.snapshot_installed
  - from: durability_p1.quorum_durable
    to: consensus_p1.durable
  - from: consensus_p1.applied
    to: gateway.applied

  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus_p0.cp_state
  - from: admission.cache_state
    to: consensus_p1.cp_state
  - from: admission.strict_fallback
    to: consensus_p0.cp_state
  - from: admission.strict_fallback
    to: consensus_p1.cp_state

  - from: consensus_p0.metrics
    to: operations.ingest
  - from: consensus_p1.metrics
    to: operations.ingest
  - from: durability_p0.metrics
    to: operations.ingest
  - from: durability_p1.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.export
    to: gateway.metrics_data
