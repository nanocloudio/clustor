# Pi 5 / CM5 bare-metal twin of `single-throughput.yaml`. Runs on
# the rig (`fluxor rig test --rig pi5-a`).
#
# Observation rides `platform.debug.to: net` — every `dev_log(…)`
# drains as a UDP datagram to port 6666. The pi5-a rig profile's
# `[telemetry.monitor_udp]` captures it (see
# `~/.config/fluxor/labs/default/rigs/pi5-a.toml`).
#
# Ephemeral external-load profile: no FS provider is wired, so the WAL retains
# recent entries in memory and acknowledges them without a durability barrier. There is
# deliberately no on-DUT injector; drive POST /propose on the HTTP diagnostic
# listener (`:19090`) from the load host. Port 9090 is the peer/client protocol
# listener and is not the benchmark HTTP endpoint.
#
# Driver: `tests/hardware/drive-cm5-rig.sh`.

target: cm5
tick_us: 3500

# Same cyclic-graph allowance as `single.yaml` — Raft's
# consensus → peer_router → consensus feedback converges via
# end-of-tick fixed point.
scheduler:
  accept_cycles: true

execution:
  domains:
    - name: main
      cores: [0]
      adaptive_flags: 2
      tick_min_us: 1750
      tick_max_us: 3500

platform:
  net: {}
  debug:
    to: net
    observe: true
    export_telemetry: otlp
    # Destination comes from ~/.config/fluxor/host.toml
    # debug.collector_ip (192.168.1.10), shared with proven log_net routing.
    export_dst_port: 4318
    # Export in coarse batches: a 1 s cadence measurably contends with the
    # request path on the single scheduler domain. Five seconds preserves
    # useful operational telemetry without paying JSON/TCP work every second.
    export_flush_ms: 60000
    # OTLP requires a Unix-epoch boot anchor. Refresh this per deployment
    # until the rig injects wall time or the DUT gains an RTC/NTP authority.
    export_epoch_sec: 1783893839

modules:
  - name: peer_router
    params:
      self_id: 0
      peer_count: 1
      listen_port: 9090
      peer0_port: 9090
  - name: gateway
    params:
      self_id: 0
  - name: consensus
    params:
      self_id: 0
      voter_count: 1
      heartbeat_interval_ms: 150
      peer_count: 1
  - name: durability
    params:
      fsync_mode: 1
      group_window_ms: 5
      group_max_pending: 4
      root_path: 0
      segment_bytes: 67108864
      skip_replay: 1
      self_id: 0
      voter_count: 1
      partition_id: 0
  - name: control_plane
  - name: admission
  - name: operations
    params:
      emit_interval_ms: 250
      listen_port: 19090
wiring:
  # Foundation net manifests own their target-specific ring capacities. This
  # graph declares traffic policy only; no duplicated buffer sizes are needed.
  - from: conn_guard.frames_tx
    to: ip.frames_rx
  - from: ip.frames_tx
    to: rp1_gem.frames_tx
  - from: ip.net_out
    to: log_net.net_in
  - from: log_net.net_out
    to: ip.net_in
  - from: ip.net_out
    to: otlp_http.net_in
  - from: otlp_http.net_out
    to: ip.net_in

  # OpenTelemetry-native module signals. Clustor's richer typed Raft/WAL/apply
  # table remains on /metrics; these Telemetry ports feed both the local
  # observer and the direct OTLP/HTTP exporter.
  - from: ip.telemetry
    to: observe.telemetry
  - from: ip.telemetry
    to: otlp_http.telemetry

  # ── ip ↔ peer_router (cleartext; no TLS) ─────────────────
  - from: ip.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: ip.net_in

  # ── peer_router → application ────────────────────────────
  - from: peer_router.cleartext
    to: gateway.requests
  - from: peer_router.peer_rx
    to: consensus.ack
  - from: peer_router.raft_rpc
    to: consensus.rpc

  # ── Client path ──────────────────────────────────────────
  - from: gateway.admin_req
    to: operations.admin_req
  - from: gateway.responses
    to: peer_router.client_resp

  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus.proposal_assigned
    to: operations.proposal_assigned
    rate: transaction
  - from: consensus.leader_state
    to: gateway.leader_state
  - from: gateway.rejected
    to: operations.proposal_rejected
    rate: transaction
  - from: operations.proposal
    to: gateway.proposals
    rate: transaction

  # ── Flow control ──────────────────────────────────────────
  - from: admission.credits
    to: gateway.credit_supply
  - from: admission.envelope
    to: gateway.throttle_status

  # ── Raft replication ──────────────────────────────────────
  # Genuine single voter: no remote AppendEntries fan-out is required.
  - from: consensus.net_out
    to: peer_router.peer_tx
  - from: consensus.lag_signal
    to: admission.lag
  - from: consensus.rpc_out
    to: peer_router.peer_tx

  # ── Persistence ───────────────────────────────────────────
  - from: consensus.log_append
    to: durability.entries
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water before proposal intake opens. Never multiplex this onto
  # wal.flushed, which also fans out durability acknowledgements.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
    rate: transaction
  - from: durability.flushed
    to: consensus.wal_flushed
    rate: transaction
  - from: consensus.cross_durability_ack
    to: durability.ack
  - from: durability.quorum_durable
    to: consensus.durable
    rate: transaction

  # ── Commit → apply ────────────────────────────────────────
  - from: consensus.entry_request
    to: durability.entry_request
    rate: transaction
  - from: durability.entry_reply
    to: consensus.entry_reply
    rate: transaction
  - from: gateway.reads
    to: consensus.read
  - from: consensus.applied
    to: gateway.applied
    rate: transaction
  - from: consensus.applied
    to: operations.applied
    rate: transaction

  # ── Snapshots ─────────────────────────────────────────────
  - from: durability.export_chunks
    to: consensus.snapshot_rx
  - from: consensus.snapshot_import
    to: durability.import_chunks
  - from: durability.manifest_auth
    to: peer_router.peer_tx
  - from: durability.installed_local
    to: consensus.snapshot_installed

  # ── Keys ──────────────────────────────────────────────────

  # ── Control plane ─────────────────────────────────────────
  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus.cp_state
  # This isolated load profile has no control-plane proof source. Wiring
  # strict_fallback would age the empty proof cache after ~1 s and reject
  # every subsequent proposal, measuring proof freshness rather than storage.
  - from: admission.permits
    to: consensus.read_permits
  - from: control_plane.routing
    to: gateway.placement

  # ── Admin (wire-level only; no HTTP path on bare-metal) ───
  - from: operations.denied
    to: gateway.admin_responses
  - from: operations.raft_commands
    to: consensus.admin_proposals
    rate: transaction
  - from: consensus.admin_applied
    to: operations.admin_applied
    rate: transaction
  - from: operations.responses
    to: gateway.admin_responses
  - from: operations.raft_proposal
    to: consensus.proposals
    rate: transaction

  # ── Telemetry ─────────────────────────────────────────────
  - from: consensus.metrics
    to: operations.ingest
  - from: durability.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.why
    to: gateway.why_data
  - from: operations.export
    to: gateway.metrics_data

  # ── HTTP diagnostic listener → operations bypass (DEV/TEST) ──
  # POSTs route around operations; same caveat as `configs/single.yaml`.
  - from: ip.net_out
    to: operations.net_in
  - from: operations.net_out
    to: ip.net_in
