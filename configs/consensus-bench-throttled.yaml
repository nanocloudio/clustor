# L2 consensus bench — THROTTLED variant
# (`.context/rfc_performance_benchmarking.md` §6, §13). Same single-node
# consensus pipeline as `consensus-bench.yaml`, but the `consensus_bench`
# injector emits TAGGED proposals into `gateway.requests` (admission
# control in the loop) at a saturating rate, to test whether the lag-based
# `admission` protects the WAL from the over-production cliff.
# Finding: it does not — throttle admits everything (lag ≈ 0 single-node),
# same cliff. propose→commit latency/throughput are read from the
# instrumented producers over /metrics + log_net. Linux target via
# fluxor-linux; see tests/hardware/README.md.
#
# DEV/TEST ONLY — HTTP admin bypasses operations.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  # L2 load injector — drives proposals into consensus.proposals.
  - name: consensus_bench
    params:
      total: 1000000
      body_size: 64
      batch_per_step: 4
      # 1 proposal every 4 ms ≈ 250/s — at or below sustainable WAL
      # throughput on this rig so the raft→wal channel never overflows
      # (raft has no backpressure on the direct-injection path). Raise the
      # rate to find the saturation knee once admission control is in the
      # loop or backpressure lands.
      inject_period: 1
      tagged: 1
      warmup_ms: 2000
  - name: peer_router
    params:
      self_id: 0
      peer_count: 1
      listen_port: 9090
      peer0_port: 9090
  - name: gateway
    params:
      self_id: 0
  - name: consensus
    params:
      self_id: 0
      voter_count: 1
      heartbeat_interval_ms: 150
      peer_count: 1
  - name: durability
    params:
      fsync_mode: 1
      group_window_ms: 5
      group_max_pending: 4
      self_id: 0
      voter_count: 1
      partition_id: 0
  - name: control_plane
  - name: admission
  - name: operations
    params:
      emit_interval_ms: 250
      listen_port: 19090
wiring:
  - from: linux_net.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: linux_net.net_in

  - from: peer_router.cleartext
    to: gateway.requests
  - from: peer_router.peer_rx
    to: consensus.ack
  - from: peer_router.raft_rpc
    to: consensus.rpc

  - from: gateway.admin_req
    to: operations.admin_req
  - from: gateway.responses
    to: peer_router.client_resp

  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus.leader_state
    to: gateway.leader_state

  - from: admission.credits
    to: gateway.credit_supply
  - from: admission.envelope
    to: gateway.throttle_status

  - from: consensus.net_out
    to: peer_router.peer_tx
  - from: consensus.lag_signal
    to: admission.lag
  - from: consensus.rpc_out
    to: peer_router.peer_tx

  - from: consensus.log_append
    to: durability.entries
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water before proposal intake opens. Never multiplex this onto
  # wal.flushed, which also fans out durability acknowledgements.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  - from: durability.flushed
    to: consensus.wal_flushed
  - from: consensus.cross_durability_ack
    to: durability.ack
  - from: durability.quorum_durable
    to: consensus.durable

  # Gap refetch: consensus pulls a durable entry's body back from
  # the WAL by index when it's missing one (post-restart recovery, or
  # a fan-out gap). Without this a restart advances commit_horizon via
  # `commit_advanced` but consensus can never actually apply past
  # it — it never received the entry bodies to apply.
  - from: consensus.entry_request
    to: durability.entry_request
    rate: transaction
  - from: durability.entry_reply
    to: consensus.entry_reply
  - from: gateway.reads
    to: consensus.read
  - from: consensus.applied
    to: gateway.applied

  - from: durability.export_chunks
    to: consensus.snapshot_rx
  - from: consensus.snapshot_import
    to: durability.import_chunks
  - from: durability.manifest_auth
    to: peer_router.peer_tx
  - from: durability.installed_local
    to: consensus.snapshot_installed


  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus.cp_state
  # NB: admission.strict_fallback → consensus.fallback_signal is
  # intentionally omitted here. With no real control plane feeding
  # control_plane, the proof cache ages out of Fresh after ~1 s and would
  # latch raft into strict fallback (dropping proposals). For an
  # isolated L2 consensus bench we keep raft appending; commit safety
  # still rests on quorum durability (durability → consensus).
  - from: admission.permits
    to: consensus.read_permits
  - from: control_plane.routing
    to: gateway.placement

  - from: operations.denied
    to: gateway.admin_responses
  - from: operations.raft_commands
    to: consensus.admin_proposals
  - from: consensus.admin_applied
    to: operations.admin_applied
  - from: operations.responses
    to: gateway.admin_responses
  - from: operations.raft_proposal
    to: gateway.proposals

  # L2 injector → gateway proposals (tagged; coexists with the
  # operations.raft_proposal fan-in already wired to this port).
  - from: consensus_bench.proposals
    to: gateway.proposals
  - from: consensus_bench.metrics
    to: operations.ingest

  - from: consensus.metrics
    to: operations.ingest
  - from: durability.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.why
    to: gateway.why_data
  - from: operations.export
    to: gateway.metrics_data

  - from: linux_net.net_out
    to: operations.net_in
  - from: operations.net_out
    to: linux_net.net_in
