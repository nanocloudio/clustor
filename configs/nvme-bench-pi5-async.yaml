# L1b PIPELINED-DURABILITY NVMe floor — PI5 BARE-METAL
# (`.context/rfc_performance_benchmarking.md` §6/§15).
#
# Same stack as `nvme-bench-pi5.yaml`:
#   nvme_bench --FS_CONTRACT--> fat32 --block ioctls--> nvme --> NVMe device
# but the sequential phase runs the ASYNC durability tier (`io_mode: 1`):
# FS_WRITE_ASYNC writes with up to `fence_depth` FS_FSYNC_SUBMIT fences
# outstanding, reaped with FS_FSYNC_POLL. Per module_step the bench does
# O(1) submissions and O(1) polls and never blocks on the device, so the
# reported KB/s is a bandwidth number — unlike `nvme-bench-pi5.yaml`, whose
# queue-depth-1 FS_WRITE + blocking FS_FSYNC path measures durability
# LATENCY and whose KB/s is that latency's reciprocal.
#
# Both configs fold their durability latency into the same
# FSYNC_LATENCY_US buckets (here: fence submit → durable), so the two tiers
# are directly comparable on one axis.
#
# `fence_depth` is the swept variable — run 1, 2, 4, 8. The nvme driver's
# async bulk-write ring is 8 slots deep, so 8 is the useful ceiling (the
# module clamps above it). Per-step block ceiling is
# `fence_depth * fsync_every`, capped by `step_batch`: at 8 × 16 = 128
# blocks × 4 KiB per 3 ms tick the scheduler-imposed ceiling is ~170 MB/s,
# comfortably above the ~388 MB/s-class device floor's WAL-path share, so a
# result below that is the storage path and not the tick rate. At
# `fence_depth: 1` the run IS tick-bound by construction (16 blocks/step) —
# that is the point of the low end of the sweep, not a defect.
#
# Read `[nvbench] async cap=… depth=… subm=… done=… outst=… wagain=…
# fagain=…` from log_net to tell whether the pipeline was actually full:
#   cap=0    — the provider does not advertise FS_CAP_FSYNC_ASYNC and the
#              run aborted ([nvbench] FAIL async unsupported). No number.
#   outst < depth with wagain=fagain=0 — the depth was never reached, so
#              the bench, not the device, set the rate.
#   wagain/fagain climbing — the device/driver ring is the limiter, which
#              is the regime the sweep is looking for.
#
# ⚠ Requires a FAT32 partition at LBA 0 on the DUT's NVMe. The bench writes
# a root-dir file "nvbench.bin" (root_path=1). verify=1 reopens and reads
# back after the last fence is durable, asserting byte-exactness.
#
# Observation: log_net UDP:6666 ([nvbench] / [fat32] / [nvme] lines) +
# GET :19090/metrics (fsync-latency histogram, module 0x16).

target: pi5
# 3 ms ticks + a 6 ms step deadline, matching `nvme-bench-pi5.yaml` so the
# two tiers are measured under the same scheduler. Bench-only; production
# stays at tick_us=1000.
tick_us: 3000

scheduler:
  accept_cycles: true

platform:
  net: {}
  debug:
    to: net
    monitor: true

modules:
  - name: nvme
    bind: m2_primary
    namespace: 1
    queue_depth: 32
  - name: fat32
    path: /
  - name: nvme_bench
    # Headroom for a full submission batch + the first step's allocation
    # burst over the leaked (orphaned) FAT. Validator caps at tick_us*2.
    step_deadline_us: 6000
    # A device stall is not a module defect: fat32/NVMe cache flushes run
    # 35-150 ms on this rig, latency the bench does not control. Count and
    # log the overrun instead of terminating the run mid-measurement.
    fault_policy: tolerate
    params:
      io_mode: 1            # L1b: pipelined async durability
      fence_depth: 8        # SWEEP THIS (1, 2, 4, 8) — driver ring is 8 deep
      block_size: 4096      # 1 cluster on a -s 8 (4 KiB cluster) volume
      seq_blocks: 2048      # 8 MiB sequential append (~128 fence samples)
      fsync_every: 16       # blocks per durability fence; with fence_depth
                            # this sets the per-step block ceiling (see above)
      rand_blocks: 0        # append-only async contract: no random overwrite
      step_batch: 128       # upper bound on FS_WRITE_ASYNC submissions/step
      step_budget_us: 5000  # ends the batch early if the device is slower than
                            # expected; sits under step_deadline_us (6000) so a
                            # stall costs one overrun, not a killed module
      root_path: 1          # write root "nvbench.bin" (no mkdir on FAT32)
      verify: 1             # reopen + read back, assert byte-exact
      start_delay_ms: 20000 # defer create+write past log_net history-skip
                            # (~30 s TAIL seed) so bracket logs survive

  - name: operations
    params:
      emit_interval_ms: 250
      listen_port: 19090
wiring:
  # ── nvme block device ↔ fat32 filesystem ────────────────
  - from: nvme.blocks
    to: fat32.blocks
  - from: fat32.block_writes
    to: nvme.requests

  # ── bench metrics → aggregator ──────────────────────────
  - from: nvme_bench.metrics
    to: operations.ingest

  # ── diagnostic HTTP surface (GET /metrics, /readyz, /why) ─
  - from: ip.net_out
    to: operations.net_in
  - from: operations.net_out
    to: ip.net_in
