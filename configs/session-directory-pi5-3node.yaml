# Clustor — 3-node deterministic-timing validation, bare-metal DUT node.
# (rfc_deterministic_timing.md §19.2 on the rig; RFC perf-bench §1 topology.)
#
# Node 0 of a REAL cross-machine 3-node cluster: this image runs on the
# bare-metal DUT (192.168.1.9); nodes 1 and 2 are fluxor-linux processes
# on the driver host (192.168.1.10, configs/session-directory-3node-rig.yaml)
# reached via the peer{N}_host cross-machine params. Derived from
# single-pi5-throughput.yaml (NVMe/FAT32 disk-durable WAL) plus the
# session_directory replicated consumer with its deterministic-timing
# smoke (smoke: 2): a TTL'd KEY_PUT whose committed expiry logs
# "[sess_dir] deadline fired" over log_net on every replica.
#
target: pi5
tick_us: 3500

# Same cyclic-graph allowance as `single.yaml` — Raft's
# consensus → peer_router → consensus feedback converges via
# end-of-tick fixed point.
scheduler:
  accept_cycles: true

execution:
  domains:
    - name: main
      cores: [0]
      adaptive_flags: 2
      tick_min_us: 1750
      tick_max_us: 3500

platform:
  net: {}
  debug:
    to: net
    observe: true
    export_telemetry: udp
    # Destination comes from ~/.config/fluxor/host.toml
    # debug.collector_ip (192.168.1.10), shared with proven log_net routing.
    # transport_buffer's UDP carrier default (the old 4318 was the
    # OTLP-over-HTTP port, from before the export path was split into
    # otel + a transport-blind carrier).
    export_dst_port: 4317
    # otel's flush is purely time-triggered — there is NO size trigger:
    # once the 512-byte accumulator fills, step_drain stops draining and
    # records back up in the kernel ring until the next cadence flush.
    # The old 60 s came from the OTLP-JSON/TCP era (that path no longer
    # exists) and would emit one <=512-byte batch per minute, dropping
    # everything else. 1 s keeps batches tracking a load run. The binary
    # /metrics path stays at 250 ms for high-resolution capture.
    export_flush_ms: 1000
    # OTLP requires a Unix-epoch boot anchor. Refresh this per deployment
    # until the rig injects wall time or the DUT gains an RTC/NTP authority.
    export_epoch_sec: 1783893839

modules:
  # Bare-metal block device and filesystem provider.
  - name: nvme
    bind: m2_primary
    namespace: 1
    queue_depth: 32
  - name: fat32
    path: /
    clean_root: 1
    init_free_hint: 20000
    clear_free_region: 4096

  - name: peer_router
    params:
      self_id: 0
      peer_count: 3
      listen_port: 9090
      peer0_port: 9090
      peer1_port: 9091
      peer1_host: "192.168.1.10"
      peer2_port: 9092
      peer2_host: "192.168.1.10"
  - name: gateway
    params:
      self_id: 0
  - name: session_directory
    params:
      replica_id: 0
      # grants smoke + deterministic-timing smoke (TTL'd KEY_PUT).
      smoke: 2
      # The pi5 TIMER::UNIX_MILLIS source is coarse-grained: between
      # its update ticks the wall reading lags the monotonic
      # extrapolation by up to ~1 s, which the default 100 ms slew
      # tolerance reads as a backward jump (rig-observed 2026-08-05:
      # leader pause_reason flapping to ClockGuardAlarm while time
      # production still succeeded on the healthy samples). Widen to
      # ride through source granularity; real regressions are far
      # larger than one tick.
      clock_slew_tolerance_ms: 1100
  - name: consensus
    params:
      self_id: 0
      voter_count: 3
      heartbeat_interval_ms: 150
      # 3, not 1: inherited from the single-node config this was derived
      # from. With peer_count 1 the replicator has no ACTIVE peer slots, so a
      # DUT elected leader ships zero AppendEntries and commit never advances
      # — it looks like a replication bug and is really a config typo.
      peer_count: 3
  - name: durability
    params:
      fsync_mode: 1
      group_window_ms: 5
      group_max_pending: 8
      root_path: 1
      fixed_segment: 1
      preallocate_settle_ms: 10000
      segment_bytes: 8388608
      skip_replay: 1
      self_id: 0
      voter_count: 3
      partition_id: 0
  - name: control_plane
  - name: admission
    params:
      entry_credit_max: 64
      entry_rate_per_sec: 950
      byte_credit_max_kib: 64
      sample_period_ms: 10
  - name: operations
    params:
      emit_interval_ms: 250
      listen_port: 19090
wiring:
  # Foundation net manifests own their target-specific ring capacities. This
  # graph declares traffic policy only; no duplicated buffer sizes are needed.
  - from: conn_guard.frames_tx
    to: ip.frames_rx
  - from: ip.frames_tx
    to: rp1_gem.frames_tx
  - from: ip.net_out
    to: log_net.net_in
  - from: log_net.net_out
    to: ip.net_in

  # OpenTelemetry-native module signals need no wiring: emission is
  # ring-based (observe and the `export_telemetry: udp` overlay drain
  # the kernel telemetry ring directly). Clustor's richer typed
  # Raft/WAL/apply table remains on /metrics.

  # ── NVMe block device ↔ FAT32 filesystem provider ───────────
  - from: nvme.blocks
    to: fat32.blocks
  - from: fat32.block_writes
    to: nvme.requests
  # ── ip ↔ peer_router (cleartext; no TLS) ─────────────────
  - from: ip.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: ip.net_in

  # ── peer_router → application ────────────────────────────
  - from: peer_router.cleartext
    to: gateway.requests
  - from: peer_router.peer_rx
    to: consensus.ack
  - from: peer_router.raft_rpc
    to: consensus.rpc

  # ── Client path ──────────────────────────────────────────
  - from: gateway.admin_req
    to: operations.admin_req
  - from: gateway.responses
    to: peer_router.client_resp

  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: session_directory.proposal_assigned
  - from: consensus.proposal_assigned
    to: operations.proposal_assigned
    rate: transaction
  - from: consensus.leader_state
    to: gateway.leader_state
  - from: consensus.leader_state
    to: session_directory.leader_state
  - from: consensus.committed_entries
    to: session_directory.committed_entries
  - from: session_directory.proposals
    to: consensus.proposals_tagged
  - from: session_directory.metrics
    to: operations.ingest
  - from: gateway.rejected
    to: operations.proposal_rejected
    rate: transaction
  - from: operations.proposal
    to: gateway.proposals
    rate: transaction

  # ── Flow control ──────────────────────────────────────────
  - from: admission.credits
    to: gateway.credit_supply

  # ── Raft replication ──────────────────────────────────────
  # Genuine single voter: no remote AppendEntries fan-out is required.
  - from: consensus.net_out
    to: peer_router.peer_tx
  - from: consensus.lag_signal
    to: admission.lag
  - from: consensus.rpc_out
    to: peer_router.peer_tx

  # ── Persistence ───────────────────────────────────────────
  - from: consensus.log_append
    to: durability.entries
    rate: transaction
  - from: durability.flushed
    to: consensus.wal_flushed
    rate: transaction
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water before proposal intake opens. Never multiplex this onto
  # wal.flushed, which also fans out durability acknowledgements.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  - from: consensus.cross_durability_ack
    to: durability.ack
  - from: durability.quorum_durable
    to: consensus.durable
    rate: transaction

  # ── Commit → apply ────────────────────────────────────────
  - from: consensus.entry_request
    to: durability.entry_request
    rate: transaction
  - from: durability.entry_reply
    to: consensus.entry_reply
    rate: transaction
  - from: gateway.reads
    to: consensus.read
  - from: consensus.applied
    to: gateway.applied
    rate: transaction
  - from: consensus.applied
    to: operations.applied
    rate: transaction

  # ── Snapshots ─────────────────────────────────────────────
  - from: durability.export_chunks
    to: consensus.snapshot_rx
  # Snapshot-install escalation (consensus/manifest.toml:250): the leader
  # emits this when a WAL read-back returns NOT_FOUND for the index a lagging
  # follower needs — i.e. the follower has fallen past what this WAL can still
  # serve. WITHOUT this edge `request_snapshot_install` hits
  # `out_snapshot_request < 0` and returns silently, so the follower can never
  # be recovered: the leader spins on NotFound forever (rig-observed at ~640
  # misses/s while the follower sat frozen). An ephemeral WAL only retains
  # ENTRY_RING_SIZE (256) entries for read-back, so this is reachable in
  # seconds under load, not an exotic corner.
  - from: consensus.snapshot_request
    to: durability.install_request
  - from: consensus.snapshot_import
    to: durability.import_chunks
  - from: durability.manifest_auth
    to: peer_router.peer_tx
  - from: durability.installed_local
    to: consensus.snapshot_installed

  # ── Keys ──────────────────────────────────────────────────

  # ── Control plane ─────────────────────────────────────────
  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus.cp_state
  # This isolated load profile has no control-plane proof source. Wiring
  # strict_fallback would age the empty proof cache after ~1 s and reject
  # every subsequent proposal, measuring proof freshness rather than storage.
  - from: admission.permits
    to: consensus.read_permits
  - from: control_plane.routing
    to: gateway.placement

  # ── Admin (wire-level only; no HTTP path on bare-metal) ───
  - from: operations.denied
    to: gateway.admin_responses
  - from: operations.raft_commands
    to: consensus.admin_proposals
    rate: transaction
  - from: consensus.admin_applied
    to: operations.admin_applied
    rate: transaction
  - from: operations.responses
    to: gateway.admin_responses
  - from: operations.raft_proposal
    to: consensus.proposals
    rate: transaction

  # ── Telemetry ─────────────────────────────────────────────
  - from: consensus.metrics
    to: operations.ingest
  - from: durability.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.why
    to: gateway.why_data
  - from: operations.export
    to: gateway.metrics_data

  # ── HTTP diagnostic listener → operations bypass (DEV/TEST) ──
  # POSTs route around operations; same caveat as `configs/single.yaml`.
  - from: operations.net_out
    to: ip.net_in
  - from: ip.net_out
    to: operations.net_in
  # The latest readiness byte is replaceable state, not an ordered event
  # stream. Give it a zero-copy mailbox so the ingress can answer /readyz
  # locally without a request/response round-trip through operations.
