# OVERDRIVE variant of consensus-bench-pi5-disk.yaml for Item 2 validation
# (RFC §14 item 3b apply-side gap recovery). inject_period=1 drives the
# injector at its full step rate (~166/s) so commit (durable) outruns apply
# and the best-effort log_observe fan-out drops entry bodies. With the
# apply-side WAL refetch, consensus reads the dropped indices back from
# the durable WAL and stays lossless: appended==committed==applied==4000.
# Watch apply APPLY_REFETCHED (metric 0x06/0x0004) climb > 0.
# L2 consensus latency/throughput bench — PI5 BARE-METAL twin of
# `consensus-bench.yaml` (`.context/rfc_performance_benchmarking.md` §6).
# Full single-node consensus pipeline with a `consensus_bench` injector
# feeding consensus.proposals directly. propose→commit latency and
# commit throughput read from the instrumented producers (raft
# commit_latency_ms, consensus commit_advances) over /metrics
# (scrape :19090 over the wire) + log_net UDP:6666.
#
# Differs from the linux twin only in: target pi5, `platform.debug.to: net`
# (log_net observation), and `ip` (not `linux_net`) as the net module.
#
# DISK-DURABLE variant: nvme + fat32 provide the FS contract, so the WAL
# writes real segment files (root_path=1, 8.3 names) to the NVMe FAT32
# partition and fsyncs through the device NVMe Flush. This is the
# disk-durable L2 commit path + the WAL's L1 metrics on real silicon.
#
# Validated 2026-06-16 on pi5-a (RFC §14): below the knee tracks offered
# rate at p50≈4–6 ms; saturating plateau ≈1000–1060/s committed, inflight
# pinned at the cap (24), commit_index sane, lossless — the durability-
# backpressure fix holds on bare metal.
#
# ⚠ Sweep mechanics: raise offered load via `inject_period` (or a SMALL
# `batch_per_step`), NOT a large batch. The injector is itself an on-DUT
# cooperative module; a heavy `batch_per_step` (e.g. 8) burns tick time and
# STARVES the commit/apply pipeline — a measurement artifact (8000/s
# offered@batch=8 collapsed achieved to ~270/s while still lossless). Keep
# batch ≤2. offered/s ≈ batch_per_step / inject_period × 1000.
#
# DEV/TEST ONLY — HTTP admin bypasses operations.
target: pi5
tick_us: 6000

scheduler:
  accept_cycles: true

platform:
  debug:
    to: net
  net: {}

modules:
  # ── disk stack: nvme block device + fat32 filesystem ──
  - name: nvme
    bind: m2_primary
    namespace: 1
    queue_depth: 32
  - name: fat32
    path: /
    clean_root: 1           # truncate the bloated root dir to one warm cluster on
                            # first create: dozens of prior runs left orphaned
                            # root entries, and scanning a cold root-dir cluster
                            # costs ~30 ms on this NVMe (first-touch read) — which
                            # blows the WAL/raft step guard (~52-entry fault).
    init_free_hint: 20000   # seed free-scan past the bench partition orphan region
    clear_free_region: 2000 # zero an 8 MiB FAT span at the hint on first create:
                            # this partition's FAT holds stale non-zero entries
                            # (never cleanly formatted) that the free-scan would
                            # otherwise walk for ~227 ms and blow the step guard.

  # L2 load injector — drives proposals into consensus.proposals.
  - name: consensus_bench
    params:
      total: 4000
      body_size: 64
      batch_per_step: 1
      # inject_period=1 offers at the full injector step rate (~166/s on the
      # 6 ms-tick disk graph). The proposals edge is a bounded FIFO; when raft
      # is pinned at the uncommitted-inflight cap (disk commit is slower than
      # the offer), the FIFO fills and channel_write returns CHAN_EAGAIN.
      # consensus_bench now honours that (counts `blocked`, retries the same
      # proposal next step), so it self-throttles to the disk commit rate
      # LOSSLESSLY at any inject_period — no proposals dropped. (Before the
      # wire_channels write_framed EAGAIN-sign fix, a full FIFO was mis-reported
      # as a successful write and the proposal was silently dropped: inject_period=1
      # ⇒ only 268/4000 reached raft. That bug is fixed.)
      inject_period: 1   # OVERDRIVE (~166/s): commit outruns apply; exercises the apply-side WAL refetch
      warmup_ms: 2000
  - name: peer_router
    params:
      self_id: 0
      peer_count: 1
      listen_port: 9090
      peer0_port: 9090
  - name: gateway
    params:
      self_id: 0
  - name: consensus
    params:
      self_id: 0
      voter_count: 1
      heartbeat_interval_ms: 150
      peer_count: 1
  - name: durability
    params:
      fsync_mode: 1
      group_window_ms: 5
      group_max_pending: 4
      root_path: 1            # 8.3 root segment names for FAT32 (no mkdir)
      segment_bytes: 65536    # 64 KiB segments → rotation within the run
      skip_replay: 1          # L1/L2 throughput bench: start fresh each run so
      self_id: 0
      voter_count: 1
      partition_id: 0
  - name: control_plane
  - name: admission
  - name: operations
    params:
      emit_interval_ms: 250
      listen_port: 19090
wiring:
  # ── nvme block device ↔ fat32 filesystem ──
  - from: nvme.blocks
    to: fat32.blocks
  - from: fat32.block_writes
    to: nvme.requests

  - from: ip.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: ip.net_in

  - from: peer_router.cleartext
    to: gateway.requests
  - from: peer_router.peer_rx
    to: consensus.ack
  - from: peer_router.raft_rpc
    to: consensus.rpc

  - from: gateway.admin_req
    to: operations.admin_req
  - from: gateway.responses
    to: peer_router.client_resp

  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus.leader_state
    to: gateway.leader_state

  - from: admission.credits
    to: gateway.credit_supply

  - from: consensus.net_out
    to: peer_router.peer_tx
  - from: consensus.lag_signal
    to: admission.lag
  - from: consensus.rpc_out
    to: peer_router.peer_tx

  - from: consensus.log_append
    to: durability.entries
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water before proposal intake opens. Never multiplex this onto
  # wal.flushed, which also fans out durability acknowledgements.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  - from: durability.flushed
    to: consensus.wal_flushed
  - from: consensus.cross_durability_ack
    to: durability.ack
  - from: durability.quorum_durable
    to: consensus.durable

  # Apply-side gap recovery (Item 2): when the best-effort log_observe
  # fan-out drops an entry body under overdrive, consensus refetches the
  # missing index from the durable WAL instead of stalling.
  - from: consensus.entry_request
    to: durability.entry_request
  - from: durability.entry_reply
    to: consensus.entry_reply
  - from: gateway.reads
    to: consensus.read
  - from: consensus.applied
    to: gateway.applied

  - from: durability.export_chunks
    to: consensus.snapshot_rx
  - from: consensus.snapshot_import
    to: durability.import_chunks
  - from: durability.manifest_auth
    to: peer_router.peer_tx
  - from: durability.installed_local
    to: consensus.snapshot_installed


  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus.cp_state
  # NB: admission.strict_fallback → consensus.fallback_signal is
  # intentionally omitted here. With no real control plane feeding
  # control_plane, the proof cache ages out of Fresh after ~1 s and would
  # latch raft into strict fallback (dropping proposals). For an
  # isolated L2 consensus bench we keep raft appending; commit safety
  # still rests on quorum durability (durability → consensus).
  - from: admission.permits
    to: consensus.read_permits
  - from: control_plane.routing
    to: gateway.placement

  - from: operations.denied
    to: gateway.admin_responses
  - from: operations.raft_commands
    to: consensus.admin_proposals
  - from: consensus.admin_applied
    to: operations.admin_applied
  - from: operations.responses
    to: gateway.admin_responses
  - from: operations.raft_proposal
    to: consensus.proposals

  # L2 injector → raft proposals (untagged port; coexists with the
  # operations.raft_proposal fan-in already wired to this port).
  - from: consensus_bench.proposals
    to: consensus.proposals
  - from: consensus_bench.metrics
    to: operations.ingest

  - from: consensus.metrics
    to: operations.ingest
  - from: durability.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.why
    to: gateway.why_data
  - from: operations.export
    to: gateway.metrics_data

  - from: ip.net_out
    to: operations.net_in
  - from: operations.net_out
    to: ip.net_in
