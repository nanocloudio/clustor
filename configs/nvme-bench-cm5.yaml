# L0/L1 WAL-PATH NVMe floor — CM5 BARE-METAL
# (`.context/rfc_performance_benchmarking.md` §6/§15).
#
# Unlike `nvme-bench.yaml` (target linux, dev_fs over the Linux VFS),
# this runs the `nvme_bench` module over the REAL bare-metal stack:
#   nvme_bench --FS_CONTRACT--> fat32 --block ioctls--> nvme --> NVMe device
# fat32 now implements the synchronous append-only FS write contract
# (FS_OPEN_CREATE / FS_WRITE / FS_FSYNC), so `wal`/`nvme_bench`'s
# FS_OPEN_CREATE resolves on bare metal instead of returning ENODEV.
#
# This measures the WAL-path floor: per-FS_FSYNC latency through the
# device's real NVMe Flush (opcode 0x00) — the number the WAL lives on.
# Distinct from the raw device floor (fluxor nvme_perf_probe, ~388 MB/s).
#
# ⚠ Requires a FAT32 partition at LBA 0 on the DUT's NVMe (the fat32
# tests rely on one). The bench writes a root-dir file "nvbench.bin"
# (root_path=1) — no parent dir needed (FAT32 has no mkdir). verify=1
# reopens + reads back, asserting byte-exactness ([nvbench] verify ok).
#
# Observation: log_net UDP:6666 ([nvbench] / [fat32] / [nvme] lines) +
# GET :19090/metrics (fsync-latency histogram, module 0x16).

target: cm5
# 3 ms ticks + a 6 ms step deadline. With step_batch=8 the per-step work
# (8 writes + up to 8 fsyncs ≈ 5 ms) EXCEEDS the tick, so the bench is
# work-bound, not tick-throttled — seq throughput reflects real device rate
# and varies with fsync_every (the L1 group-fsync sweep). The 6 ms deadline
# absorbs both that work and the first step's allocation burst over the
# leaked (orphaned) FAT. Bench-only; production stays at tick_us=1000.
tick_us: 3000

scheduler:
  accept_cycles: true

platform:
  net: {}
  debug:
    to: net
    monitor: true

modules:
  - name: nvme
    bind: m2_primary
    namespace: 1
    queue_depth: 32
  - name: fat32
    path: /
  - name: nvme_bench
    # Headroom for 8 writes+fsyncs/step + the first step's allocation burst
    # over the leaked (orphaned) FAT. Validator caps at tick_us*2 = 6000.
    step_deadline_us: 6000
    params:
      block_size: 4096      # 1 cluster on a -s 8 (4 KiB cluster) volume
      seq_blocks: 128       # 512 KiB sequential append
      fsync_every: 1        # per-write fsync = the strict-WAL floor
      rand_blocks: 0        # append-only FS contract: no random overwrite
      step_batch: 8         # work-bound: 8 writes+fsyncs/step (~5 ms) > tick,
                            # so seq throughput is device-rate, not tick-bound
      root_path: 1          # write root "nvbench.bin" (no mkdir on FAT32)
      verify: 1             # reopen + read back, assert byte-exact
      start_delay_ms: 20000 # defer create+write past log_net history-skip
                            # (~30 s TAIL seed) so bracket logs survive

  - name: operations
    params:
      emit_interval_ms: 250
      listen_port: 19090
wiring:
  # ── nvme block device ↔ fat32 filesystem ────────────────
  - from: nvme.blocks
    to: fat32.blocks
  - from: fat32.block_writes
    to: nvme.requests

  # ── bench metrics → aggregator ──────────────────────────
  - from: nvme_bench.metrics
    to: operations.ingest

  # ── diagnostic HTTP surface (GET /metrics, /readyz, /why) ─
  - from: ip.net_out
    to: operations.net_in
  - from: operations.net_out
    to: ip.net_in
