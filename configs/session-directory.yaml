# Clustor: single-node graph + session_directory — the session-
# directory / reservation-authority consumer (fluxor rfc_protocols.md
# §8.3 / §13.7; docs/architecture/session_directory.md).
#
# Same graph as single.yaml plus `session_directory` wired as a
# replicated consumer:
#   - consensus.committed_entries → session_directory (strict
#     per-entry apply of the session-registry state machine)
#   - session_directory.proposals → consensus.proposals_tagged
#     (fan-in beside gateway.proposals_tagged — both emit frame-atomic
#     MSG_CLIENT_PROPOSAL envelopes and the single-domain graph steps
#     modules cooperatively, so writes never interleave mid-frame)
#
# `smoke: 1` makes the directory propose BIND → RESERVE → RESERVE for
# a synthetic session at boot; the two committed grants (start=0 then
# start=4096, visible as MON_SESSION reservation_granted lines and the
# final "[sess_dir] smoke complete") prove the quorum-committed grant
# path end-to-end. tests/session_directory_e2e.rs asserts exactly
# that.
#
target: linux
tick_us: 1000

# The clustor module graph is intentionally cyclic — the consensus
# feedback loop (consensus → peer_router → consensus, plus the
# admission/durability feedback edges) only converges through these
# cycles. accept_cycles tells fluxor's prepare_graph to
# accept the graph and route the cycles via the end-of-tick fixed
# point per RFC §5.1.
scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: peer_router
    params:
      self_id: __SELF_ID__
      peer_count: 1
      listen_port: __LISTEN_PORT__
      peer0_port: __LISTEN_PORT__
  - name: gateway
    params:
      self_id: __SELF_ID__
  - name: consensus
    params:
      self_id: __SELF_ID__
      voter_count: 1
      heartbeat_interval_ms: 150
      peer_count: 1
  - name: session_directory
    params:
      replica_id: __SELF_ID__
      smoke: 1
  - name: durability
    params:
      self_id: __SELF_ID__
      voter_count: 1
      partition_id: 0
  - name: control_plane
  - name: admission
  - name: operations
    params:
      listen_port: __HTTP_PORT__
wiring:
  # ── linux_net ↔ peer_router (no TLS) ─────────────────────
  - from: linux_net.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: linux_net.net_in

  # ── peer_router → application ────────────────────────────
  - from: peer_router.cleartext
    to: gateway.requests
  - from: peer_router.peer_rx
    to: consensus.ack
  # Inbound peer Raft RPCs (RequestVote/AppendEntries/heartbeat)
  # land on peer_router.raft_rpc and must reach consensus for the
  # cluster to elect a leader and replicate. `gateway.raft_rpc`
  # (HTTP-injected RPCs) is intentionally unwired to avoid a fan-in
  # collision on consensus.rpc.
  - from: peer_router.raft_rpc
    to: consensus.rpc

  # ── HTTP routing ─────────────────────────────────────────
  - from: gateway.admin_req
    to: operations.admin_req
  - from: gateway.responses
    to: peer_router.client_resp

  # ── Client pipeline ──────────────────────────────────────
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  # Correlation feedback so gateway can map (correlation_id → wal_index)
  # for response routing. See RFC §5.8.
  # Rerouted (vs single.yaml): the session directory is the tagged
  # proposer in this graph, so IT needs the correlation→wal_index
  # assignments for reply attribution. gateway's client-response
  # mapping goes without — no external client proposals flow in this
  # graph (admin ops ride their own path). A graph carrying BOTH
  # client proposals and a session directory needs a demux or the
  # partitioned-tagged port.
  - from: consensus.proposal_assigned
    to: session_directory.proposal_assigned
  - from: consensus.leader_state
    to: gateway.leader_state

  # ── Flow control ──────────────────────────────────────────
  - from: admission.credits
    to: gateway.credit_supply
  - from: admission.envelope
    to: gateway.throttle_status

  # ── Raft replication ──────────────────────────────────────
  - from: consensus.net_out
    to: peer_router.peer_tx
  - from: consensus.lag_signal
    to: admission.lag
  - from: consensus.rpc_out
    to: peer_router.peer_tx

  # ── Persistence ───────────────────────────────────────────
  - from: consensus.log_append
    to: durability.entries
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water before proposal intake opens. Never multiplex this onto
  # wal.flushed, which also fans out durability acknowledgements.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  # Spec §10.4.1: every replica tracks its own `local_wal_durable_index`
  # in consensus so followers can stamp it into each AE response.
  # The leader uses it only as its own progress[self] in
  # durability; fan-out via fluxor's auto-inserted tee.
  - from: durability.flushed
    to: consensus.wal_flushed
  # Cross-node DurabilityAck fan-in (spec §10.4.1). Followers' durable
  # indices land at the leader's durability via this edge so
  # quorum-fsync `wal_committed_index` can advance.
  - from: consensus.cross_durability_ack
    to: durability.ack
  - from: durability.quorum_durable
    to: consensus.durable

  # ── Commit → apply ────────────────────────────────────────
  # Per-entry body fan-out (see clustor-linux-minimal.yaml comment).
  # Gap refetch: consensus pulls a durable entry's body back from
  # the WAL by index when it's missing one (post-restart recovery, or
  # a fan-out gap). Without this a restart advances commit_horizon via
  # `commit_advanced` but consensus can never actually apply past
  # it — it never received the entry bodies to apply.
  - from: consensus.entry_request
    to: durability.entry_request
    rate: transaction
  - from: durability.entry_reply
    to: consensus.entry_reply
  # Linearizable-read submissions (RFC §4.3): consensus
  # holds reads until the ReadIndex point is reached.
  - from: gateway.reads
    to: consensus.read
  - from: consensus.applied
    to: gateway.applied

  # ── Snapshots ─────────────────────────────────────────────
  - from: durability.export_chunks
    to: consensus.snapshot_rx
  - from: consensus.snapshot_import
    to: durability.import_chunks
  - from: durability.manifest_auth
    to: peer_router.peer_tx
  # Snapshot install completion → consensus fast-forwards state.
  - from: durability.installed_local
    to: consensus.snapshot_installed

  # ── Keys ──────────────────────────────────────────────────

  # ── Control plane ─────────────────────────────────────────
  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus.cp_state
  - from: admission.strict_fallback
    to: consensus.cp_state
  - from: admission.permits
    to: consensus.read_permits
  - from: control_plane.routing
    to: gateway.placement

  # ── Admin ─────────────────────────────────────────────────
  # FREEZE / THAW / TRANSFER_LEADER / DURABILITY_MODE / SNAPSHOT are
  # applied locally by consensus; ADD/REMOVE_VOTER still return
  # ADMIN_STATUS_UNSUPPORTED until joint consensus lands (RFC §14).
  - from: operations.denied
    to: gateway.admin_responses
  - from: operations.raft_commands
    to: consensus.admin_proposals
  - from: consensus.admin_applied
    to: operations.admin_applied
  - from: operations.responses
    to: gateway.admin_responses
  # Replicable admin ops (FREEZE / THAW / DURABILITY_MODE) ride
  # the client proposal path so every replica sees the entry.
  # `operations.raft_proposal` emits `MSG_CLIENT_PROPOSAL`
  # with body `[ADMIN_MAGIC:8][command_id:u32][op_code][op_body]`;
  # `consensus` re-emits it as `MSG_ADMIN_COMMITTED` for
  # `consensus` to apply on every replica.
  - from: operations.raft_proposal
    to: consensus.proposals

  # ── Telemetry ─────────────────────────────────────────────
  - from: consensus.metrics
    to: operations.ingest
  - from: durability.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.why
    to: gateway.why_data
  - from: operations.export
    to: gateway.metrics_data

  # ── HTTP diagnostic surface ──────────────────────────────────
  # Shares the `linux_net` instance with `peer_router`; each anchor
  # binds its own listen port via CMD_BIND. Telemetry fan-out from
  # `operations` to both `gateway` and `operations` rides
  # the auto-tee.
  - from: linux_net.net_out
    to: operations.net_in
  - from: operations.net_out
    to: linux_net.net_in

  # ── Session directory (replicated consumer) ───────────────
  - from: consensus.committed_entries
    to: session_directory.committed_entries
  - from: session_directory.proposals
    to: consensus.proposals_tagged
  # Telemetry heartbeat like every other module.
  - from: session_directory.metrics
    to: operations.ingest
