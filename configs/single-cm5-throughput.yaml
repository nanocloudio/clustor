# Pi 5 / CM5 bare-metal twin of `single-throughput.yaml`. Runs on
# the rig (`fluxor rig test --rig pi5-a`).
#
# Observation rides `platform.debug.to: net` — every `dev_log(…)`
# drains as a UDP datagram to port 6666. The pi5-a rig profile's
# `[telemetry.monitor_udp]` captures it (see
# `~/.config/fluxor/labs/default/rigs/pi5-a.toml`).
#
# Disk-durable external-load profile: nvme + fat32 provide the FS contract,
# so the WAL writes and fsyncs real segment files on the CM5 NVMe. There is
# deliberately no on-DUT injector; drive POST /propose on the HTTP diagnostic
# listener (`:19090`) from the load host. Port 9090 is the peer/client protocol
# listener and is not the benchmark HTTP endpoint.
#
# Driver: `tests/hardware/drive-cm5-rig.sh`.

target: cm5
tick_us: 3500

# Same cyclic-graph allowance as `single.yaml` — Raft's
# raft_engine → replicator → peer_router → raft_engine feedback
# converges via end-of-tick fixed point.
scheduler:
  accept_cycles: true

execution:
  domains:
    - name: main
      cores: [0]
      adaptive_flags: 2
      tick_min_us: 1750
      tick_max_us: 3500

platform:
  net: {}
  debug:
    to: net
    observe: true
    export_telemetry: otlp
    # Destination comes from ~/.config/fluxor/host.toml
    # debug.collector_ip (192.168.1.10), shared with proven log_net routing.
    export_dst_port: 4318
    # OTLP JSON/TCP currently shares the transaction domain: a second CM5
    # execution domain fails the boot/readiness gate on this firmware. Batch
    # direct export once per minute; the binary /metrics path below remains at
    # 250 ms for high-resolution benchmark capture.
    export_flush_ms: 60000
    # OTLP requires a Unix-epoch boot anchor. Refresh this per deployment
    # until the rig injects wall time or the DUT gains an RTC/NTP authority.
    export_epoch_sec: 1783893839

modules:
  # Bare-metal block device and filesystem provider.
  - name: nvme
    bind: m2_primary
    namespace: 1
    queue_depth: 32
  - name: fat32
    path: /
    clean_root: 1
    init_free_hint: 20000
    clear_free_region: 4096

  - name: peer_router
    params:
      self_id: 0
      peer_count: 1
      listen_port: 9090
      peer0_port: 9090
  - name: client_codec
    params:
      self_id: 0
  - name: throttle_gate
  - name: raft_engine
    step_deadline_us: 3500
    params:
      self_id: 0
      voter_count: 1
      heartbeat_interval_ms: 150
  - name: replicator
    params:
      self_id: 0
      peer_count: 1
  - name: commit_tracker
    params:
      self_id: 0
      voter_count: 1
  - name: apply_pipeline
    step_deadline_us: 3500
  - name: wal
    # Fluxor's v1 partial restart flushes connected channels without
    # reinitialising this stateful module, which can create a durable log hole.
    # Permit realistic NVMe tail latency, then fail closed on a true timeout.
    step_deadline_us: 12000
    step_deadline_burst_us: 28000
    fault_policy: skip
    params:
      fsync_mode: 1
      group_window_ms: 5
      # The 5 ms wall-clock window remains the latency authority. Allowing up
      # to eight hot-path records lets FAT32 fill sectors more completely at
      # saturation instead of forcing partial-sector rewrites every 4 records.
      group_max_pending: 8
      root_path: 1
      # Fixed-capacity, terminator-delimited segments persist FAT size metadata
      # once at creation; steady-state fsync writes data only. Eight MiB keeps
      # rotation well outside ordinary benchmark windows while bounding cold
      # reservation time on the rig.
      fixed_segment: 1
      # Measured on the consumer NVMe: immediate post-allocation load can
      # queue for 400+ ms; after 10 s it sustains the configured rate at
      # ~24 ms p99. Keep /readyz closed for that quiescence interval.
      preallocate_settle_ms: 10000
      segment_bytes: 8388608
      skip_replay: 1
  - name: durability_ledger
    params:
      self_id: 0
      voter_count: 1
      partition_id: 0
  - name: cp_bridge
  - name: cp_proof_cache
  - name: read_gate
  - name: flow_controller
    params:
      # The controller republishes an absolute credit pool every sample.
      # Wall-clock admission is independent of adaptive scheduler cadence.
      # entry_credit_max is only a delayed-sample burst clamp. Sixty-four
      # requests cover one measured worst-case (~55 ms) service interval at
      # 1000/s without changing the sustained admission rate.
      entry_credit_max: 64
      # Warm low-latency knee is ~1040/s, but cold media runs vary above
      # ~950/s. Keep the sustained production admission below that variance;
      # overload is rejected rather than becoming a 400+ ms queue.
      entry_rate_per_sec: 950
      byte_credit_max_kib: 64
      sample_period_ms: 10
  - name: key_manager
  - name: telemetry_agg
    # Bench profile (RFC §4.4): export /metrics every 250 ms so a short
    # measurement window still captures fresh samples. Production configs
    # omit this and default to 1 s.
    params:
      emit_interval_ms: 250
  - name: client_surface
  - name: rbac
  - name: admin_handler
  - name: snapshot_engine
  - name: placement_router

  # HTTP diagnostic surface so the rig scenario can drive admin
  # POSTs (raft doesn't propose a bootstrap no-op in single-node
  # mode, so without a client surface wal stays idle).
  - name: http_adapter
  - name: http_ingress
    params:
      listen_port: 19090

wiring:
  # Foundation net manifests own their target-specific ring capacities. This
  # graph declares traffic policy only; no duplicated buffer sizes are needed.
  - from: conn_guard.frames_tx
    to: ip.frames_rx
  - from: ip.frames_tx
    to: rp1_gem.frames_tx
  - from: ip.net_out
    to: log_net.net_in
  - from: log_net.net_out
    to: ip.net_in
  - from: ip.net_out
    to: otlp_http.net_in
  - from: otlp_http.net_out
    to: ip.net_in

  # OpenTelemetry-native module signals. Clustor's richer typed Raft/WAL/apply
  # table remains on /metrics; these Telemetry ports feed both the local
  # observer and the direct OTLP/HTTP exporter.
  - from: ip.telemetry
    to: observe.telemetry
  - from: ip.telemetry
    to: otlp_http.telemetry
  - from: fat32.telemetry
    to: observe.telemetry
  - from: fat32.telemetry
    to: otlp_http.telemetry

  # ── NVMe block device ↔ FAT32 filesystem provider ───────────
  - from: nvme.blocks
    to: fat32.blocks
  - from: fat32.block_writes
    to: nvme.requests
  # ── ip ↔ peer_router (cleartext; no TLS) ─────────────────
  - from: ip.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: ip.net_in

  # ── peer_router → application ────────────────────────────
  - from: peer_router.cleartext
    to: client_surface.requests
  - from: peer_router.peer_rx
    to: replicator.ack
  - from: peer_router.raft_rpc
    to: raft_engine.rpc

  # ── Client path ──────────────────────────────────────────
  - from: client_surface.client_req
    to: client_codec.raw
  - from: client_surface.admin_req
    to: rbac.request
  - from: client_surface.responses
    to: peer_router.client_resp

  - from: client_codec.parsed
    to: throttle_gate.requests
  - from: throttle_gate.admitted
    to: raft_engine.proposals_tagged
  - from: raft_engine.proposal_assigned
    to: client_codec.proposal_assigned
  - from: raft_engine.proposal_assigned
    to: http_adapter.proposal_assigned
    rate: transaction
  - from: raft_engine.leader_state
    to: client_codec.leader_state
  - from: throttle_gate.rejected
    to: client_codec.responses
  - from: throttle_gate.rejected
    to: http_adapter.proposal_rejected
    rate: transaction
  - from: http_adapter.proposal
    to: throttle_gate.requests
    rate: transaction

  # ── Flow control ──────────────────────────────────────────
  - from: flow_controller.credits
    to: throttle_gate.credit_supply
  - from: flow_controller.envelope
    to: client_surface.throttle_status

  # ── Raft replication ──────────────────────────────────────
  # Genuine single voter: no remote AppendEntries fan-out is required.
  - from: replicator.net_out
    to: peer_router.peer_tx
  - from: replicator.match_indices
    to: commit_tracker.match
  - from: replicator.lag_signal
    to: flow_controller.lag
  - from: raft_engine.rpc_out
    to: peer_router.peer_tx

  # ── Persistence ───────────────────────────────────────────
  - from: raft_engine.log_append
    to: wal.entries
    rate: transaction
  - from: wal.flushed
    to: durability_ledger.ack
    rate: transaction
  - from: wal.flushed
    to: raft_engine.wal_flushed
    rate: transaction
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water before proposal intake opens. Never multiplex this onto
  # wal.flushed, which also fans out durability acknowledgements.
  - from: wal.replay_complete
    to: raft_engine.wal_replay_complete
    rate: transaction
  - from: replicator.cross_durability_ack
    to: durability_ledger.ack
  - from: durability_ledger.quorum_durable
    to: commit_tracker.durable
    rate: transaction

  # ── Commit → apply ────────────────────────────────────────
  - from: commit_tracker.committed
    to: apply_pipeline.entries
    rate: transaction
  - from: commit_tracker.committed
    to: raft_engine.commit
    rate: transaction
  - from: raft_engine.commit_advanced
    to: apply_pipeline.entries
    rate: transaction
  - from: raft_engine.log_observe
    to: apply_pipeline.log_entries
    rate: transaction
  - from: apply_pipeline.entry_request
    to: wal.entry_request
    rate: transaction
  - from: wal.entry_reply
    to: apply_pipeline.entry_reply
    rate: transaction
  - from: client_codec.reads
    to: apply_pipeline.read
  - from: apply_pipeline.applied
    to: client_codec.responses
    rate: transaction
  - from: apply_pipeline.applied
    to: http_adapter.applied
    rate: transaction
  - from: client_codec.responses_out
    to: client_surface.client_responses

  # ── Snapshots ─────────────────────────────────────────────
  - from: snapshot_engine.export_chunks
    to: replicator.snapshot_rx
  - from: replicator.snapshot_import
    to: snapshot_engine.import_chunks
  - from: snapshot_engine.manifest_auth
    to: peer_router.peer_tx
  - from: wal.compaction_signal
    to: snapshot_engine.trigger
  - from: snapshot_engine.installed_local
    to: raft_engine.snapshot_installed

  # ── Keys ──────────────────────────────────────────────────
  - from: key_manager.dek_epoch
    to: wal.key_update
  - from: key_manager.dek_epoch
    to: snapshot_engine.key_update

  # ── Control plane ─────────────────────────────────────────
  - from: cp_bridge.proof
    to: cp_proof_cache.proof
  - from: cp_proof_cache.cache_state
    to: read_gate.cache
  - from: cp_proof_cache.cache_state
    to: commit_tracker.cp_state
  # This isolated load profile has no control-plane proof source. Wiring
  # strict_fallback would age the empty proof cache after ~1 s and reject
  # every subsequent proposal, measuring proof freshness rather than storage.
  - from: read_gate.permits
    to: apply_pipeline.read_permits
  - from: placement_router.routing
    to: client_codec.placement

  # ── Admin (wire-level only; no HTTP path on bare-metal) ───
  - from: rbac.authorized
    to: admin_handler.requests
  - from: rbac.denied
    to: client_surface.admin_responses
  - from: admin_handler.raft_commands
    to: raft_engine.admin_proposals
    rate: transaction
  - from: raft_engine.admin_applied
    to: admin_handler.applied
    rate: transaction
  - from: admin_handler.responses
    to: client_surface.admin_responses
  - from: admin_handler.raft_proposal
    to: raft_engine.proposals
    rate: transaction

  # ── Telemetry ─────────────────────────────────────────────
  - from: raft_engine.metrics
    to: telemetry_agg.ingest
  - from: replicator.metrics
    to: telemetry_agg.ingest
  - from: wal.metrics
    to: telemetry_agg.ingest
  - from: flow_controller.metrics
    to: telemetry_agg.ingest
  - from: cp_proof_cache.metrics
    to: telemetry_agg.ingest
  - from: snapshot_engine.metrics
    to: telemetry_agg.ingest
  - from: rbac.audit_events
    to: telemetry_agg.ingest
  - from: peer_router.metrics
    to: telemetry_agg.ingest
  - from: throttle_gate.metrics
    to: telemetry_agg.ingest
  - from: commit_tracker.metrics
    to: telemetry_agg.ingest
  - from: apply_pipeline.metrics
    to: telemetry_agg.ingest
  - from: http_adapter.metric_sample
    to: telemetry_agg.ingest
  - from: telemetry_agg.readyz
    to: client_surface.readyz_data
  - from: telemetry_agg.why
    to: client_surface.why_data
  - from: telemetry_agg.export
    to: client_surface.metrics_data

  # ── HTTP diagnostic listener → admin_handler bypass (DEV/TEST) ──
  # POSTs route around rbac; same caveat as `configs/single.yaml`.
  - from: http_ingress.net_out
    to: ip.net_in
  - from: ip.net_out
    to: http_ingress.net_in
  - from: http_ingress.request
    to: http_adapter.request
    rate: transaction
  - from: http_adapter.response
    to: http_ingress.response
    rate: transaction
  # The latest readiness byte is replaceable state, not an ordered event
  # stream. Give it a zero-copy mailbox so the ingress can answer /readyz
  # locally without a request/response round-trip through http_adapter.
  - from: http_adapter.ready_snapshot
    to: http_ingress.ready_snapshot
    buffer_group: 1
    rate: transaction
  - from: telemetry_agg.readyz
    to: http_adapter.readyz
  - from: telemetry_agg.why
    to: http_adapter.why
  - from: telemetry_agg.export
    to: http_adapter.metrics
  - from: http_adapter.admin_request
    to: admin_handler.requests
    rate: transaction
