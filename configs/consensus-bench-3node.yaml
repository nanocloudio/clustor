# Clustor — L2 consensus bench, 3-replica (real quorum replication).
# `.context/rfc_performance_benchmarking.md` §14 item 2.
#
# 3-node twin of `configs/consensus-bench.yaml`: the full multi-node
# consensus pipeline (real AppendEntries → 2 followers → quorum-durable
# commit) with a `consensus_bench` injector feeding consensus.proposals
# directly on every node. Only the leader's raft drains proposals (the
# followers' injectors just backpressure on a full local channel), so the
# leader drives real quorum-replicated commits; scrape whichever node
# reports raft role=2 (leader). The delta vs the single-node bench's
# commit_latency_ms IS the quorum-RTT contribution. This is also the
# meaningful test of the follower-path fail-closed fix (RFC §13): the
# leader replicates to follower WALs that must accept entries or NACK.
#
# TEMPLATE: render per node with `fluxor render-template` (see below),
# substituting __SELF_ID__ / __LISTEN_PORT__ / __PEER{0,1,2}_PORT__ /
# __HTTP_PORT__. Driven by a 3-process spawn (see tests/hardware/README.md
# L2 3-node procedure); the cluster harness templating in
# tests/support/cluster.rs renders the same placeholders.
#
# Like the single-node bench, the admission.strict_fallback →
# consensus.fallback_signal edge is CUT: with no real control plane the
# proof cache ages out of Fresh and would latch raft into strict fallback
# (dropping proposals). Commit safety still rests on quorum durability.
#
# DEV/TEST NOTE — HTTP admin is authorized as `default_role` by the
# operations module's rbac component (HTTP carries no peer identity).

target: linux
tick_us: 1000

# Accept structural cycles. The clustor graph has a metrics fanout
# `consensus → operations → gateway → consensus.rpc`
# which is a topological cycle but a semantic feedback edge — each
# step is single-pass and never re-enters the cycle within one tick.
scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  # L2 load injector — drives proposals into consensus.proposals on
  # every node; only the leader appends. Same params as the single-node
  # bench; tune batch_per_step / inject_period to set offered load.
  - name: consensus_bench
    params:
      total: 1000000
      body_size: 64
      batch_per_step: 4
      inject_period: 1
      warmup_ms: 2500
  - name: peer_router
    params:
      self_id: __SELF_ID__
      peer_count: 3
      listen_port: __LISTEN_PORT__
      peer0_port: __PEER0_PORT__
      peer1_port: __PEER1_PORT__
      peer2_port: __PEER2_PORT__

  - name: gateway
    params:
      self_id: __SELF_ID__
  - name: consensus
    params:
      self_id: __SELF_ID__
      voter_count: 3
      heartbeat_interval_ms: 150
      peer_count: 3
  - name: durability
    params:
      fsync_mode: 1
      group_window_ms: 5
      group_max_pending: 4
      self_id: __SELF_ID__
      voter_count: 3
      partition_id: 0
  - name: control_plane
  - name: admission
  - name: operations
    params:
      emit_interval_ms: 250
      listen_port: __HTTP_PORT__
wiring:
  # ── Transport: linux_net ↔ peer_router ─────────────────────
  - from: linux_net.net_out
    to: peer_router.net_in
  - from: peer_router.net_out
    to: linux_net.net_in

  # ── Inbound peer traffic ───────────────────────────────────
  # peer_router demuxes the 5-byte partitioned wire envelope
  # (`[partition_id:u16 LE][msg_type:u8][len:u16 LE]`):
  #   MSG_APPEND_ENTRIES_RESP                          → peer_rx
  #   votes / heartbeats / AppendEntries / snapshot    → raft_rpc
  # Non-Raft client traffic still routes through `cleartext` →
  # `gateway`. `gateway.raft_rpc` is intentionally
  # unwired here to avoid the fan-in collision documented in
  # `multi-2node-2p.yaml`.
  - from: peer_router.peer_rx
    to: consensus.ack
  - from: peer_router.raft_rpc
    to: consensus.rpc

  # ── Outbound peer traffic ──────────────────────────────────
  - from: consensus.rpc_out
    to: peer_router.peer_tx
  - from: consensus.net_out
    to: peer_router.repl_tx

  # ── HTTP/client routing ────────────────────────────────────
  - from: peer_router.cleartext
    to: gateway.requests
  - from: gateway.admin_req
    to: operations.admin_req
  - from: gateway.responses
    to: peer_router.client_resp

  # ── Client pipeline ────────────────────────────────────────
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  # Correlation feedback so gateway can map (correlation_id → wal_index).
  - from: consensus.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus.leader_state
    to: gateway.leader_state

  # ── Flow control ───────────────────────────────────────────
  - from: admission.credits
    to: gateway.credit_supply
  - from: admission.envelope
    to: gateway.throttle_status

  # ── Raft replication ───────────────────────────────────────
  - from: consensus.lag_signal
    to: admission.lag

  # ── Persistence ────────────────────────────────────────────
  - from: consensus.log_append
    to: durability.entries
  # Dedicated boot handoff: Raft must resume its index at the exact WAL
  # replay high-water before proposal intake opens. Never multiplex this onto
  # wal.flushed, which also fans out durability acknowledgements.
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  # Raft §5.3 conflict-repair: a leader-divergent follower truncates its WAL
  # suffix on this control edge (shares wal.compact_before; MSG_WAL_TRUNCATE_AFTER).
  - from: consensus.wal_compact
    to: durability.compact_before
  # Spec §10.4.1: every replica tracks its own `local_wal_durable_index`
  # in consensus so followers can stamp it into each AE response.
  - from: durability.flushed
    to: consensus.wal_flushed
  # Cross-node DurabilityAck fan-in (spec §10.4.1). The leader's
  # the durability ledger composes per-replica progress from local
  # wal.flushed AND this synthesized stream of follower fsync acks
  # extracted from AppendEntriesResponse envelopes — without this
  # edge, multi-node clusters can't compute quorum-fsync and commit
  # under DUR_GROUP_FSYNC stalls indefinitely.
  - from: consensus.cross_durability_ack
    to: durability.ack
  - from: consensus.entry_request
    to: durability.entry_request
  - from: durability.entry_reply
    to: consensus.entry_reply
  # consensus's gap-refetch shares the WAL's entry_request /
  # entry_reply ports with the consensus (requests fan in; replies
  # tee to both consumers, each matching on its own request ids /
  # indices and ignoring the rest). A restarted follower NEEDS this
  # path: its WAL replay restores the log — so raft log-matching
  # succeeds and the leader never re-ships those entries — and the
  # replayed bodies can only reach the apply pipeline by reading
  # them back from the local WAL.
  - from: durability.quorum_durable
    to: consensus.durable

  # ── Commit → apply ─────────────────────────────────────────
  - from: gateway.reads
    to: consensus.read
  - from: consensus.applied
    to: gateway.applied

  # ── Snapshots ──────────────────────────────────────────────
  - from: durability.export_chunks
    to: consensus.snapshot_rx
  - from: consensus.snapshot_import
    to: durability.import_chunks
  - from: durability.manifest_auth
    to: peer_router.peer_tx
  - from: durability.installed_local
    to: consensus.snapshot_installed

  # ── Keys ───────────────────────────────────────────────────

  # ── Control plane ──────────────────────────────────────────
  - from: control_plane.proof
    to: admission.proof
  - from: admission.cache_state
    to: consensus.cp_state
  # NB: admission.strict_fallback → consensus.fallback_signal is
  # intentionally omitted (see file header) — no real control plane, so
  # the proof cache would otherwise latch raft into strict fallback.
  - from: admission.permits
    to: consensus.read_permits
  - from: control_plane.routing
    to: gateway.placement

  # ── Admin ──────────────────────────────────────────────────
  - from: operations.denied
    to: gateway.admin_responses
  - from: operations.raft_commands
    to: consensus.admin_proposals
  - from: consensus.admin_applied
    to: operations.admin_applied
  - from: operations.responses
    to: gateway.admin_responses
  # Replicable admin ops (FREEZE / THAW / DURABILITY_MODE) ride
  # the client proposal path so every replica applies the entry.
  - from: operations.raft_proposal
    to: consensus.proposals

  # ── L2 injector ────────────────────────────────────────────
  # consensus_bench → raft proposals (untagged port; coexists with the
  # operations.raft_proposal fan-in already wired to this port).
  - from: consensus_bench.proposals
    to: consensus.proposals
  - from: consensus_bench.metrics
    to: operations.ingest

  # ── Telemetry ──────────────────────────────────────────────
  - from: consensus.metrics
    to: operations.ingest
  - from: durability.metrics
    to: operations.ingest
  - from: admission.metrics
    to: operations.ingest
  - from: peer_router.metrics
    to: operations.ingest
  - from: gateway.metrics
    to: operations.ingest
  - from: operations.readyz
    to: gateway.readyz_data
  - from: operations.why
    to: gateway.why_data
  - from: operations.export
    to: gateway.metrics_data

  # ── HTTP diagnostic surface ──────────────────────────────────
  - from: linux_net.net_out
    to: operations.net_in
  - from: operations.net_out
    to: linux_net.net_in
