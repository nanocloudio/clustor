[workspace]
members = [".", "crates/clustor-common", "tools/clustor-bench"]
# Bare `cargo test`/`build` in the root dir covers the whole
# workspace (the root manifest is package+workspace, which would
# otherwise scope commands to the root package alone).
default-members = [".", "crates/clustor-common", "tools/clustor-bench"]

[workspace.package]
# Shared by every publishable crate via `version.workspace = true`.
# Mirrors `fluxor.toml::[project].version`; publish enforces equality.
version = "0.0.1"

# MSRV, per standards/lints.md: `reason = "..."` on lint attributes
# and `#[expect(...)]` both stabilised in 1.81. Members inherit via
# `rust-version.workspace = true`.
rust-version = "1.81"

# Workspace lint policy, per standards/lints.md §1 — the canonical
# baseline every member's `[lints]` block mirrors. No member
# currently inherits it verbatim: all three packages (`clustor`,
# `clustor-common`, `clustor-bench`) inline a relaxed mirror because
# cargo doesn't allow `lints.workspace = true` alongside per-lint
# overrides (each is exempted via `[[ci.lints.exemption]]` in
# `fluxor.toml`). Keep this table as the reference the mirrors are
# diffed against. The `priority = -1` on group enables makes the
# per-lint overrides apply after the group, not be silently
# overridden by it. `unsafe_code` stays at `deny` — lints.md §5
# rejects workspace-level `forbid`; no-unsafe crates escalate to
# `forbid` locally.
[workspace.lints.rust]
unsafe_code               = "deny"
unused_must_use           = "deny"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
all      = { level = "deny",  priority = -1 }
pedantic = { level = "warn",  priority = -1 }

allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

dbg_macro     = "deny"
todo          = "warn"
unimplemented = "warn"
unwrap_used   = "deny"
expect_used   = "warn"
panic         = "warn"
print_stdout  = "deny"
print_stderr  = "deny"

module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
missing_const_for_fn    = "allow"
too_many_lines          = "allow"

[package]
name = "clustor"
version = "0.0.1"
edition = "2021"
rust-version.workspace = true

# Clustor ships as a set of fluxor-native PIC modules (see
# `modules/app/`, built by `fluxor modules build`). The cargo package itself
# has no library target beyond the empty `src/lib.rs` stub; it exists so the
# host-side test and bench targets that pull
# `modules/common/replica_facade.rs` via `#[path = ...]` can be
# compiled and exercised on the host toolchain. On-target module
# ELFs are produced by `fluxor modules build --target <board>`.
autobins = false
autoexamples = false
autobenches = false
autotests = false

# Per-package lint set. Cargo doesn't allow mixing
# `lints.workspace = true` with per-lint overrides in the same
# `[lints]` block, and this package is effectively all test/bench
# code around an empty `src/lib.rs` stub — the strict lib-grade lints in
# `[workspace.lints]` (unwrap_used = "deny", etc.) don't fit. The
# package is exempted from the workspace-lint opt-in audit via
# `[[ci.lints.exemption]]` in `fluxor.toml`; the block below mirrors
# the workspace baseline minus the lints that conflict with the
# test/bench shape.
[lints.rust]
# `tests/support/cluster.rs` uses libc::setpgid in an unsafe pre_exec
# closure to put spawned fluxor children into a fresh process group.
# That single call site keeps us at `deny` instead of `forbid` here;
# the host package never grows other unsafe.
unsafe_code               = "deny"
unused_must_use           = "deny"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
# Group enables (priority = -1 so per-lint overrides below win).
all      = { level = "deny",  priority = -1 }
pedantic = { level = "allow", priority = -1 }   # relaxed for this test/bench-shaped package; lib crates should re-tighten to "warn"

# `#[allow]` discipline.
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

# Strict hygiene that survives the pedantic relaxation.
dbg_macro     = "deny"
todo          = "warn"
unimplemented = "warn"

# Lib-grade lints that don't fit a test/bench package.
unwrap_used        = "allow"
expect_used        = "allow"
panic              = "allow"
print_stdout       = "allow"
print_stderr       = "allow"
disallowed_macros  = "allow"   # println diagnostics in tests/benches

# Pedantic carve-outs left in case pedantic is ever re-tightened here.
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
missing_const_for_fn    = "allow"
too_many_lines          = "allow"

[lib]
# `src/lib.rs` is an empty stub, not a real library. Tests under
# `tests/` are integration crates and do not need a `clustor` library
# to link against — they pull module source files directly with
# `#[path = "../modules/.../..."]`.
# The stub has no benches; without this, `cargo bench` runs the lib's
# default libtest harness (which rejects criterion's `--quick`).
bench = false

[dependencies]

[dev-dependencies]
tempfile = "3.23.0"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
# Used by the cluster harness (`tests/support/cluster.rs`) to put
# spawned `fluxor` parent + `fluxor-linux` grandchild into a fresh
# process group so SIGTERM reaches the whole tree. Without it,
# killed fluxor parents leave orphaned fluxor-linux processes that
# hold listen ports and break subsequent test runs.
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Host-side integration tests. The modules themselves are compiled
# to PIC ELF artefacts by `fluxor modules build`; the entries below are the
# cargo-driven host harness:
#
#   facade           — facade contract unit/integration coverage
#   facade_stress    — facade structures under thread stress
#   config_validate  — renders every configs/*.yaml with fluxor.toml
#                      defaults and runs `fluxor build --check` against
#                      `target: linux`. Always runs (no E2E deps).
#   cluster          — multi-node fluxor-linux harness smoke tests.
#                      Runtime-skips when fluxor-linux or the .fmod
#                      artefacts under target/fluxor/<silicon>/modules/
#                      are absent — i.e. a green `cargo test cluster`
#                      WITHOUT those prereqs means the tests skipped,
#                      not that they exercised the cluster path. Set
#                      `CLUSTOR_REQUIRE_E2E=1` to make missing prereqs
#                      a hard failure (see `tests/support/cluster.rs`).
#   partition        — 2-node 2-partition coverage via the
#                      multi-2node-2p template (same skip semantics).
#   chaos            — fault injection on top of the cluster harness
#                      (same skip semantics).
#   sandbox          — self-test for `tests/support/sandbox.rs`
[[test]]
name = "facade"
path = "tests/facade.rs"

[[test]]
name = "limit_register"
path = "tests/limit_register.rs"

[[test]]
name = "facade_stress"
path = "tests/facade_stress.rs"

[[test]]
name = "cluster"
path = "tests/cluster.rs"

[[test]]
name = "partition"
path = "tests/partition.rs"

[[test]]
name = "chaos"
path = "tests/chaos.rs"

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"

[[test]]
name = "config_validate"
path = "tests/config_validate.rs"

[[test]]
name = "http_admin"
path = "tests/http_admin.rs"

[[test]]
name = "sdk_primitives"
path = "tests/sdk_primitives.rs"

[[test]]
name = "session_registry"
path = "tests/session_registry.rs"

[[test]]
name = "timing"
path = "tests/timing.rs"

[[test]]
name = "timing_cluster_e2e"
path = "tests/timing_cluster_e2e.rs"

[[test]]
name = "session_directory_e2e"
path = "tests/session_directory_e2e.rs"

[[test]]
name = "wal_group_fsync"
path = "tests/wal_group_fsync.rs"

[[test]]
name = "wal_replay"
path = "tests/wal_replay.rs"

# Volatile (agreement-only) 3-node composition + disk-mode state-dir
# self-heal. Binds real ports; run with `--test-threads=1`.
[[test]]
name = "volatile_cluster"
path = "tests/volatile_cluster.rs"

# Host-side unit coverage for the WAL's below-ring-floor segment-scan
# fallback. Pulls `modules/app/durability/wal.rs` in via `#[path]`
# against a mock SyscallTable (in-memory FS + byte-FIFO channels);
# no fluxor-linux / .fmod prereqs, always runs.
[[test]]
name = "wal_scan"
path = "tests/wal_scan.rs"

# Host-side coverage for the correlated Raft <-> WAL truncation
# handshake. Mounts `modules/app/consensus/raft.rs` and
# `modules/app/durability/wal.rs` in one crate, wired to each other
# through shared mock channel handles; no fluxor-linux / .fmod
# prereqs, always runs.
[[test]]
name = "wal_truncate"
path = "tests/wal_truncate.rs"

# Host-side unit coverage for the snapshot pointer's two-slot,
# CRC-protected layout. Pulls `modules/app/durability/snapshot.rs`
# in via `#[path]` against a mock SyscallTable (in-memory FS +
# byte-FIFO channels); no fluxor-linux / .fmod prereqs, always runs.
[[test]]
name = "snap_pointer"
path = "tests/snap_pointer.rs"

# Host-side unit coverage for raft's write-then-adopt metadata
# persistence discipline. Pulls `modules/app/consensus/raft.rs` in via
# `#[path]` against a mock SyscallTable (in-memory FS with fault
# injection + byte-FIFO channels); no fluxor-linux / .fmod prereqs,
# always runs.
[[test]]
name = "raft_meta"
path = "tests/raft_meta.rs"

# Host-side unit coverage for name-durable publication of WAL segments
# and snapshot artefacts, and for fixed-segment admission when
# preallocation is unavailable. Pulls raft.rs + wal.rs + snapshot.rs in
# via `#[path]` against a mock SyscallTable whose directory entries are
# volatile until fenced; no fluxor-linux / .fmod prereqs, always runs.
[[test]]
name = "name_fence"
path = "tests/name_fence.rs"

# Deterministic, seeded end-to-end Raft fault matrix. Mounts the whole
# consensus composite (raft, replicator, commit, apply) and durability
# composite (wal, ledger, snapshot) for several nodes in one crate,
# wired through a seeded router and a mock SyscallTable that injects
# faults at each pipeline boundary; no fluxor-linux / .fmod prereqs,
# always runs. Serialise with `--test-threads=1`: the mock kernel is
# process-global.
[[test]]
name = "raft_fault_matrix"
path = "tests/raft_fault_matrix.rs"

# Criterion benches. Each uses `harness = false` so criterion's own
# main runs instead of the default libtest harness. Run with
# `cargo bench` or `cargo bench --bench <name> -- --quick`. All
# benches pull `modules/common/replica_facade.rs` directly via
# `#[path]` — no library link is required.
#
# `benches/` is `.gitignore`d like `tests/` (the project keeps both
# trees out of git); the files live on disk and these entries wire
# them into cargo. `autobenches = false` keeps cargo from
# autodiscovering anything else.
[[bench]]
name = "wire_codec"
path = "benches/wire_codec.rs"
harness = false

[[bench]]
name = "inflight_table"
path = "benches/inflight_table.rs"
harness = false

[[bench]]
name = "committed_subscriber"
path = "benches/committed_subscriber.rs"
harness = false
