# Clustor project config consumed by the `fluxor` CLI. See
# ~/Development/nanocloudio/standards/{ci,fluxor-modules,tests,lints,dependencies}.md
# for the schema each table belongs to.

# Project identity (standards/dependencies.md §2.1). Required for
# `fluxor publish`; downstream projects reference clustor by this name.
[project]
name    = "clustor"
version = "0.0.1"

# Cross-project dependencies (standards/dependencies.md §2.2).
# Resolves to fluxor's published source crates and fmod palette via
# the local registry. PIC modules in `modules/app/*/mod.rs` consume
# the materialised SDK source at
# `target/fluxor/fluxor-abi/sdk/<file>.rs` (populated by `fluxor sync`).
[dependencies]
fluxor = "0.0.1"
# wave publishes the protocol-module palette (http, ws_stream, rtp).
wave   = "0.0.1"

[ci]
# Module targets to build in CI phase 3. Clustor is host-only today;
# the cluster harness consumes `bcm2712` `.fmod` artefacts as PIC on
# linux/aarch64. This list is silicon and host tokens only — never a
# board (`pi5` is a board; its modules are the `bcm2712` artefacts
# already listed). Add `rp2350` here when that backend lands.
targets = ["bcm2712"]

[ci.test]
# Runtime gate (CI phase 3.5, after the strict module build): the
# sequential, thread-bounded e2e suite. Without this, `fluxor ci`
# proves lint/build only — green would not mean behaviour.
scripts = ["tools/ci-e2e.sh", "scripts/cli-e2e.sh"]

[ci.lints]
# All three workspace members (`clustor`, `clustor-common`,
# `clustor-bench`) are exempted from the `[lints] workspace = true`
# opt-in audit because cargo doesn't allow mixing
# `lints.workspace = true` with per-lint overrides in the same
# `[lints]` table, and each package's reality needs some baseline
# lints relaxed (`unwrap_used` / `panic` / `print_stdout` for the
# test/bench shapes, plus `dead_code` for the facade crate). Each
# package inlines a slightly relaxed mirror of `[workspace.lints]`
# in its own `[lints]` block.
[[ci.lints.exemption]]
crate  = "clustor"
reason = "test/bench-only package; cargo doesn't allow `lints.workspace = true` + per-lint overrides in the same table, so the package inlines a relaxed mirror of [workspace.lints]"

[[ci.lints.exemption]]
crate  = "clustor-common"
reason = "no_std facade over #[path]-mounted modules/common fragments; cargo doesn't allow `lints.workspace = true` + per-lint overrides in the same table, and the crate needs `dead_code` plus the test-block lints (`unwrap_used`/`panic`) relaxed, so it inlines a relaxed mirror of [workspace.lints]"

[[ci.lints.exemption]]
crate  = "clustor-bench"
reason = "driver-host bench CLI (clustor-scrape/clustor-loadgen); prints JSON to stdout and unwraps on arg parsing, so it inlines a relaxed mirror of [workspace.lints] like the clustor package"

[ci.hygiene]
# Tiers where inline tests are banned. `modules/**` is no_std PIC and
# can't host a std test harness; `src/**` holds only the empty
# `src/lib.rs` stub.
forbid_inline_tests = ["modules", "src"]
mode = "strict"
max_inline_lines = 80

[ci.templates]
dir = "configs"
# Defaults for the template-render gate (CI phase 1.5). These values
# are just enough to make every template render without leftover
# `__KEY__` placeholders — they are *not* the production values used
# when actually launching a node. See `fluxor up` / per-rig profiles
# for runtime substitutions.
vars = { SELF_ID = "0", LISTEN_PORT = "9090", PEER0_PORT = "9090", PEER1_PORT = "9091", PEER2_PORT = "9092", HTTP_PORT = "19090" }

[required]
# Optional wire-ABI assertion (defense in depth). The authoritative
# ABI is derived from the resolved fluxor version in `[dependencies]`
# above; this pin makes any drift fail the version-skew phase of
# `fluxor ci` explicitly rather than as a downstream link error.
# Bump only when fluxor's `modules/sdk/wire.rs::ABI_VERSION`
# changes (module headers / channel hints / contract ids break).
# See standards/fluxor-modules.md §5 and standards/dependencies.md.
fluxor = { abi = 1 }
