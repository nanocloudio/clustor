version = "0.1.0"
timer_class = "agnostic"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

# http_adapter — bridges Fluxor's foundation/http to clustor's diagnostic
# surfaces (RFC §4.4). The adapter:
#
#   - Caches the latest readyz, why and metrics envelopes from
#     `telemetry_agg`.
#   - Receives `MSG_HTTP_REQUEST` frames from a downstream HTTP server
#     module (Fluxor `foundation/http` or equivalent) on `request_in`.
#   - Emits `MSG_HTTP_RESPONSE` frames on `response_out` for the
#     `/readyz`, `/why`, `/metrics` paths. Unknown paths get a 404.
#
# Optional in single-node configs: leave `request_in` unwired and the
# adapter still keeps the latest envelopes cached so a graph wired
# later can pick them up.

[[ports]]
name = "readyz"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "why"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "request"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "proposal_assigned"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "applied"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "proposal_rejected"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "response"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope (3) + response header (5) + metrics cache (7600).
max_record = 7608
rate_class_max = "transaction"

[[ports]]
name = "metric_sample"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "admin_request"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope (3) + fixed admin command buffer (1024).
max_record = 1027
rate_class_max = "transaction"

[[ports]]
name = "proposal"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope + correlation id + maximum HTTP proposal body.
max_record = 1035
rate_class_max = "transaction"

[[ports]]
name = "ready_snapshot"
direction = "output"
content_type = "OctetStream"
buffer_size = 64
max_record = 8
rate_class_max = "transaction"

[observability]
# Synchronous proposal-correlation health. Occupancy/high-water show whether
# the bounded tables are approaching saturation; unmatched/no-slot/timeouts
# distinguish overload amplification from downstream WAL latency.
metrics = ["requests", "requests_404", "correlations_inflight", "indices_inflight", "inflight_high_water", "proposal_timeouts", "commit_timeouts", "assignments_unmatched", "assignments_no_slot", "applies_unmatched", "rejections", "queue_unavailable", "committed"]
