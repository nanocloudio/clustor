version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "requests"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "credit_supply"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "admitted"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "rejected"
direction = "output"
content_type = "OctetStream"

# MSG_METRIC_SAMPLE fan-in to telemetry_agg.ingest (RFC §4.3). Appended
# last so admitted (out[0]) / rejected (out[1]) keep their indices.
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
# Admission control: every request lands on admitted or rejected.
# Emitted as typed MSG_METRIC_SAMPLE counters (RFC §4.2).
metrics = ["requests_admitted", "requests_rejected"]
