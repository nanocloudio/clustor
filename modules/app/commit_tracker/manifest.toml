version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "match"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "durable"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "cp_state"
direction = "input"
content_type = "OctetStream"

# Voter-set updates from raft_engine.voter_set (RFC §1.2). Carries
# `MSG_VOTER_SET_UPDATE` `[current:u8][joint:u8][joint_active:u8]`
# every time membership changes. While the joint set is active, the
# commit index advances only when an entry is replicated to a
# majority of BOTH the current and joint voter sets.
#
# STATUS: this input is wired and the joint-aware quorum logic is
# implemented, but none of the shipped configs route
# `raft_engine.voter_set → commit_tracker.voter_set` today (admin
# `ADD/REMOVE_VOTER` is `ADMIN_STATUS_UNSUPPORTED`, so no joint
# transitions can fire). When membership changes land, every config
# that runs joint consensus must also add this edge plus the matching
# wiring into `durability_ledger` (which needs to grow its own
# `voter_set` input first). See manifest comment on
# `raft_engine.voter_set`.
[[ports]]
name = "voter_set"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "committed"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope (3) + term/index commit horizon (16).
max_record = 19
rate_class_max = "transaction"

# MSG_METRIC_SAMPLE fan-in to telemetry_agg.ingest (RFC §4.3). Appended
# last so `committed` keeps output index 0.
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
# Quorum commit-index computation, emitted as typed
# MSG_METRIC_SAMPLE (commit_index gauge,
# commit_advances counter), partition-stamped for multi-Raft graphs.
metrics = ["commit_index", "commit_advances"]

# Min-match retention floor → snapshot_engine.retention_floor
# (MSG_COMPACTION_FLOOR): gates snapshot triggers — and
# therefore WAL compaction — behind the slowest live voter's replicated
# index, so a leader-local snapshot can never compact entries a lagging
# follower still needs (with manifest-only snapshots that follower could
# otherwise never catch up, and its permanent lag signal strangles the
# proposal path via flow_controller). Optional; leave unwired on
# followers and single-voter graphs (min match == commit there).
[[ports]]
name = "retention_floor"
direction = "output"
content_type = "OctetStream"
