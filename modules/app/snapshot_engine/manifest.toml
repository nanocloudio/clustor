version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

# Snapshot manifest persistence (see mod.rs). Manifests land at
# `wal/p<NNNN>_snap_<NNNNNNNN>.bin` relative to the fluxor process's
# current working directory — all partitions share the same `wal/`
# directory as the WAL segments, with the partition_id stamped into
# the filename rather than a per-partition subdirectory. `write`
# (not `exclusive`) lets multi-Raft graphs instantiate one
# snapshot_engine per partition over the same FS contract; the
# manifest-gate (the `required_caps` bitmap) actually grants access
# at runtime.
#
# Operator requirement (shared with `wal`): the `wal/` directory
# MUST exist and be writable in the launching process's CWD before
# fluxor starts. The Linux FS provider's `OPEN_CREATE` opcode
# creates files but does not auto-`mkdir` parents — there is no
# `FS_MKDIR` syscall today. A missing `wal/` directory means
# `[snap] no fs` fires on every snapshot trigger and no manifest is
# persisted, which is a data-loss hazard in production. See
# `modules/app/wal/manifest.toml` for the same note from the WAL
# side.
#
# On bare-metal FAT32 (no mkdir, 8.3 names) set param `root_path: 1`
# to write `<p:1hex><idx:7hex>.SNP` at the FS root instead — set it
# together with the wal module's `root_path` so segments and
# snapshots share a layout. Superseded snapshot files are retired
# via FS_UNLINK once the newer one is durable (providers without
# `caps::UNLINK` simply accumulate orphans, as before).
[[resources]]
requires_contract = "fs"
access = "write"

[[ports]]
name = "import_chunks"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "trigger"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "key_update"
direction = "input"
content_type = "OctetStream"

# On-demand install request from replicator (§4.2). Payload: `[target:u8]`
# (0xFF = broadcast). Fires when a follower has fallen below the WAL
# retention floor and the replicator can no longer satisfy it through
# AE conflict-repair retry alone.
[[ports]]
name = "install_request"
direction = "input"
content_type = "OctetStream"

# Aggregated per-kpg retention floors from a downstream
# `compaction_coordinator` (e.g. lattice's
# `modules/app/compaction_coordinator/`). The snapshot engine tracks
# the latest `floor_revision` per `kpg_id` and refuses to advance
# compaction past any active floor — without this input, a watcher
# whose `start_revision` is below a fresh snapshot's
# `last_included_index` cannot replay after rebind. Optional:
# single-node or non-replay-bound deployments leave this port
# unwired and the engine treats every trigger as permitted.
# Payload: `MSG_COMPACTION_FLOOR [kpg_id:u16 LE][floor_revision:u64 LE]`.
[[ports]]
name = "retention_floor"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "export_chunks"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "manifest_auth"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# Snapshot install completion signal to raft_engine. When a complete
# `MSG_INSTALL_SNAPSHOT` sequence arrives on `import_chunks` (via
# replicator) and the `done` flag is set, we emit
# `MSG_SNAPSHOT_INSTALLED` here so raft_engine can fast-forward
# `last_log_*` and `commit_index`. See RFC §5.13.
[[ports]]
name = "installed_local"
direction = "output"
content_type = "OctetStream"

# ── App state-machine snapshot (RFC §2.1) ────────────────────────────
# Optional. When unwired, snapshots stay manifest-only: peers learn the
# (term, index) and trust their own log/WAL, which is only sound on a
# graph that never replays from a compaction floor.
#
# Input index 5 / output index 4 — appended so existing port indices
# are unchanged.

# App → engine: `MSG_APP_SNAPSHOT_CHUNK` stream carrying the encoded
# state machine, labelled with the app's own applied position.
[[ports]]
name = "app_snapshot_body"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 4124
rate_class_max = "transaction"

# Engine → app: `MSG_APP_SNAPSHOT_REQUEST` (capture now) on the local
# trigger path, and `MSG_APP_SNAPSHOT_RESET` + chunk stream when a peer
# snapshot is installed.
[[ports]]
name = "app_snapshot_ctl"
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
max_record = 4124
rate_class_max = "transaction"

[observability]
# Chunked snapshot export/import + manifest persistence. Typed
# MSG_METRIC_SAMPLE counters (snapshots_taken, chunks_imported,
# triggers_deferred) plus the transfer_seconds histogram (RFC §4.1),
# timed from first install chunk to `done`. Partition-stamped.
metrics = ["snapshots_taken", "chunks_imported", "triggers_deferred", "bytes_written", "install_failures", "app_bodies_received", "app_captures_timed_out"]
histograms = ["transfer_seconds"]
