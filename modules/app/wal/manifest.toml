version = "0.1.0"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "entries"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "key_update"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "entry_request"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "compact_before"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "flushed"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "compaction_signal"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "entry_reply"
direction = "output"
content_type = "OctetStream"

# Boot-time replay-complete signal to raft_engine (MSG_WAL_REPLAY_COMPLETE
# `[term:u64][high_water:u64]`). Emitted exactly once after the WAL's
# replay scan transitions PHASE_REPLAY → NORMAL, handing raft the EXACT
# on-disk high-water it reconstructed so a recovering node resumes its
# log index there instead of at the throttled RAFT0000.MET hint. A
# DEDICATED edge — must NOT share `flushed` (which fans out to
# durability_ledger). Optional; leave unwired for non-recovery graphs.
[[ports]]
name = "replay_complete"
direction = "output"
content_type = "OctetStream"

# WAL segments land at `wal/p<NNNN>_seg_<NNNNNNNN>` relative to the
# fluxor process's current working directory. All partitions share
# one `wal/` directory; the partition_id is stamped into the
# filename rather than a per-partition subdirectory. `write` (not
# `exclusive`) lets multi-Raft graphs instantiate one `wal` per
# partition over the same FS contract; the manifest-gate (the
# `required_caps` bitmap) is what actually grants access at runtime.
#
# Operator requirement: the `wal/` directory MUST exist and be
# writable in the launching process's CWD before fluxor starts.
# The Linux FS provider's `OPEN_CREATE` opcode creates files but
# does not auto-`mkdir` parents — there is no `FS_MKDIR` syscall
# today. The single-directory layout means one `mkdir wal` (or a
# symlink to real storage: `ln -s /var/lib/quantum/wal wal`)
# suffices for any partition count. A missing `wal/` silently
# degrades the WAL to in-memory only — entries are acked but
# never persisted — which is fine for ephemeral dev rigs but a
# data-loss hazard in production.
[[resources]]
requires_contract = "fs"
access = "write"

[observability]
# Metric ids mirror `wire::metric_ids` (WAL_*). Emitted as typed
# MSG_METRIC_SAMPLE envelopes to telemetry_agg (RFC §4.3) plus the
# legacy MSG_METRICS lane and the `[wal] hb` heartbeat line.
# bytes_written is the AEAD-segment lane. pending_depth is the §4.2
# group-fsync saturation gauge. fsync_latency_ms is the §4.1 fixed
# histogram (15 bounds + Inf, µs-classified at each FS_FSYNC).
metrics = ["entries_written", "bytes_written", "segment_seq", "pending_depth", "write_errors", "checksum_failures", "truncations"]
histograms = ["fsync_latency_ms"]
