version = "0.1.0"
timer_class = "agnostic"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "ack"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "quorum_durable"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope (3) + durability proof (19).
max_record = 22
rate_class_max = "transaction"

[observability]
# Per-replica fsynced indices -> quorum-durable index; `[dur] quorum` on advance.
metrics = ["durable_index", "quorum_transitions"]
