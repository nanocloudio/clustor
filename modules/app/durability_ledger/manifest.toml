version = "0.1.0"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "ack"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "quorum_durable"
direction = "output"
content_type = "OctetStream"

[observability]
# Per-replica fsynced indices -> quorum-durable index; `[dur] quorum` on advance.
metrics = ["durable_index", "quorum_transitions"]
