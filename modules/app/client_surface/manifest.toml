version = "0.1.0"
timer_class = "agnostic"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "requests"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "throttle_status"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "client_responses"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "admin_responses"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "readyz_data"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "why_data"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "metrics_data"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "raft_rpc"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "client_req"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "admin_req"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "responses"
direction = "output"
content_type = "OctetStream"

[observability]
# Envelope demux/aggregate between peer_router and raft/codec/rbac.
metrics = ["bytes_in", "bytes_out", "requests"]
