version = "0.1.0"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

# Untagged proposals from session_processor / gateway.
[[ports]]
name = "proposals"
direction = "input"
content_type = "OctetStream"

# Tagged proposals (payload is `[correlation_id:u64 LE][body]`). The
# router preserves the correlation prefix on the egress so each
# consensus.proposals_partitioned_tagged drain sees the same
# correlation_id the proposer assigned, regardless of which partition
# accepted the proposal.
[[ports]]
name = "proposals_tagged"
direction = "input"
content_type = "OctetStream"

# NOTE: this module deliberately has no `shard_map` input. The
# control-plane shard map names the PRG that SERVES a shard, which is a
# different namespace from the raft partition this router picks; it is
# consumed on the ownership path (`EdgeMap` in `edge_routing_core`, on
# the routing stream). This router places a shard's LOG by
# `shard % num_partitions`, always.
#
# Adding an input here renumbers the inputs after it; check
# `dev_channel_port(sys, 0, N)` indices when touching this file.

# Per-partition outputs in two families:
#
#   out[0..N]  proposals_p<i>          → consensus_p<i>.proposals_partitioned
#   out[N..2N] proposals_tagged_p<i>   → consensus_p<i>.proposals_partitioned_tagged
#
# Each carries the 5-byte partitioned envelope. Untagged outputs carry
# the bare body; tagged outputs carry `[correlation_id:u64 LE][body]`.
# MAX_LOCAL_PARTITIONS = 4 in mod.rs because the fluxor static graph
# allows 8 outputs per direction (4 untagged + 4 tagged).

[[ports]]
name = "proposals_p0"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "proposals_p1"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "proposals_p2"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "proposals_p3"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "proposals_tagged_p0"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "proposals_tagged_p1"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "proposals_tagged_p2"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "proposals_tagged_p3"
direction = "output"
content_type = "OctetStream"

[observability]
# Stateless partition demux — fans proposals to the per-partition consensus
# instances by id without transforming them.
exempt = "stateless partition demultiplexer; proposal throughput is counted at each per-partition consensus instance (proposals_received), not re-counted here"
