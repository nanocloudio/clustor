version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

# durability — WAL, quorum durability ledger, snapshots and key
# epochs as one composite module (standards fluxor-modules.md §8).
#
# Components: wal (segment WAL: CRC32C framing, replay, group/async
# fenced fsync, truncation, compaction, gap-refetch serving), ledger
# (per-replica durable indices → quorum proofs), snapshot (manifest
# persistence + chunked install transfer + retention floors + app
# snapshot round-trip), keys (DEK epoch rotation).
#
# Variants:
#   disk (default) — durable composition; FS-backed segments and
#     snapshots; quorum proofs on `quorum_durable`.
#   volatile — in-memory retention selected at compile time; the
#     ledger component is compiled out, so `ack` and `quorum_durable`
#     are absent and the composition is structurally incapable of
#     emitting a durability proof. Acknowledgements on `flushed` mean
#     replicated-volatile at best.
#
# Deployment note (disk): segments live under `wal/` in the process
# working directory unless `root_path = 1` (bare-metal FAT32 8.3
# layout at the FS root, shared by segments and snapshots). A missing
# `wal/` is created at first open; a hard FS failure holds entry
# intake (raft backpressures) rather than degrading — in-memory
# operation is only ever the volatile variant's declared mode.

permissions = []

[[resources]]
requires_contract = "fs"
access = "write"

[[variant]]
name = "volatile"
features = ["volatile"]
omit_ports = ["ack", "quorum_durable"]

[[variant]]
name = "disk"
# Marker feature: the durable path is the base component set; the
# marker satisfies the variant-is-a-feature-set rule without gating
# any code of its own.
features = ["disk"]
default = true

# ── inputs ───────────────────────────────────────────────────

[[ports]]
name = "entries"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "entry_request"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "compact_before"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "ack"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "import_chunks"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "trigger"
direction = "input"
content_type = "OctetStream"

# A request re-broadcasts the most recent snapshot. One arriving
# BEFORE any snapshot exists triggers a capture at the wal high-water
# instead (synchronous finalise, so the step is classified Burst, on
# manifest-only graphs; an `app_snapshot_ctl` capture request when an
# app state machine is wired). Volatile graphs never rotate a segment,
# so this is their only snapshot trigger.
[[ports]]
name = "install_request"
direction = "input"
content_type = "OctetStream"

# Application retention floors (`MSG_COMPACTION_FLOOR`, partitioned):
# the lowest index the application can still ask this log for. Bounds
# segment RETIREMENT in the wal, never the snapshot — a snapshot is
# state and is always safe to take; the entries below it are content a
# consumer inside its window may still read from disk.
[[ports]]
name = "retention_floor"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "app_snapshot_body"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 4124
rate_class_max = "transaction"

# ── outputs ──────────────────────────────────────────────────

[[ports]]
name = "flushed"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope (3) + fsync ack (17).
max_record = 20
rate_class_max = "transaction"

[[ports]]
name = "replay_complete"
direction = "output"
content_type = "OctetStream"
# Dedicated boot handoff — never multiplexed onto `flushed`, which
# also fans out durability acknowledgements.

[[ports]]
name = "entry_reply"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope (3) + reply header (28) + entry body (2048).
max_record = 2079
rate_class_max = "transaction"

[[ports]]
name = "compaction_signal"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "quorum_durable"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope (3) + durability proof (19).
max_record = 22
rate_class_max = "transaction"

[[ports]]
name = "export_chunks"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "manifest_auth"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "installed_local"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "app_snapshot_ctl"
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
max_record = 4124
rate_class_max = "transaction"

[[ports]]
name = "cert_refresh"
direction = "output"
content_type = "OctetStream"

[observability]
metrics = [
  # wal — the snapshot component shares `bytes_written`,
  # `name_fence` and `name_unfenced` under its own source id.
  "entries_written", "bytes_written", "segment_seq", "pending_depth",
  "write_errors", "checksum_failures", "truncations", "truncate_failures",
  "continuity_errors", "input_budget_bytes", "pump_records", "stashed_holds",
  "steps", "current_index", "open_rc", "replayed",
  "replay_hw", "replay_fsize", "entryreq_served", "entryreq_notfound",
  "fault_expected", "fault_got", "segment_mode", "preallocate_failures",
  "preallocate_errno", "name_fence", "name_unfenced", "compact_floored",
  # snapshot
  "snapshots_taken", "chunks_imported", "triggers_deferred", "install_failures",
  "app_bodies_received", "app_captures_timed_out"
]
histograms = ["fsync_latency_ms", "transfer_seconds"]

# Runtime group activation (MSG_SLOT_ACTIVATE), the durability half of a
# migration's PROVISIONING work. Activating a consensus slot WITHOUT its
# durability slot gives the new group nowhere to persist: it can never
# commit, campaigns forever, and its election traffic starves the groups
# that were working. Appended LAST so no existing port index shifts.
[[ports]]
name = "slot_activate"
direction = "input"
content_type = "OctetStream"

# Cold-read request: a Kafka Fetch whose offset aged out of the
# in-memory ring but whose record is still in the WAL. Same wire shape
# as `entry_request`; a SEPARATE channel because that one is the
# crash-recovery refetch path and its request_id space is fully
# allocated. Declared LAST so no existing port index shifts.
[[ports]]
name = "cold_read"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "cold_read_reply"
direction = "output"
content_type = "OctetStream"
