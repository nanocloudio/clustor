version = "0.1.0"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

# Unused start trigger; the injector auto-runs after warmup. Leave
# unwired in configs.
[[ports]]
name = "trigger"
direction = "input"
content_type = "OctetStream"

# MSG_CLIENT_PROPOSAL bodies into consensus.proposals (untagged port).
[[ports]]
name = "proposals"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
# L2 consensus load injector (RFC §6): emits proposals at a saturating
# rate and reports phase / proposals_sent / blocked. The propose→commit
# latency + throughput it drives are captured by the consensus
# module's raft (commit_latency_ms) and commit (commit_advances)
# components. Not a
# data-mover, so exempt from the instrumentation contract.
exempt = "L2 consensus load injector; drives offered load + reports inject counts, not data-plane telemetry"
