version = "0.1.0"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "dek_epoch"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "cert_refresh"
direction = "output"
content_type = "OctetStream"

[observability]
# Pure DEK/KEK epoch source on a rotation timer — moves no data-plane bytes.
# Key-epoch rollovers are observed where the keys are consumed: wal segment
# AEAD (segment_seq) and tls session establishment.
exempt = "pure key-epoch source on a rotation timer; no data-plane bytes — epoch rollovers are observed where keys are consumed (wal AEAD segments, tls sessions)"
