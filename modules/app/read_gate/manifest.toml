version = "0.1.0"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "cache"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "permits"
direction = "output"
content_type = "OctetStream"

[observability]
# Linearizable read-permit gate; reads_blocked counts strict-fallback blocks.
metrics = ["reads_permitted", "reads_blocked"]
