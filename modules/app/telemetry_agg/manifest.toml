version = "0.1.0"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

# Pulls the kernel-scope step-time histogram over the monitor syscall
# (`STEP_HISTOGRAM_QUERY`, RFC §4.3) — requires the `monitor` capability.
# Without it, bare-metal EL0 capability enforcement denies the call
# (`[cap] module called 0x0c55 without permissions = ["monitor"]`) and the
# step histogram is silently empty. Mirrors foundation/observe's grant.
permissions = ["monitor"]

[[ports]]
name = "ingest"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "readyz"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "why"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "export"
direction = "output"
content_type = "OctetStream"

[observability]
# The metrics collector itself — decodes other modules MSG_METRIC_SAMPLE and
# re-emits aggregated /readyz, /why, /metrics payloads. Originates no
# data-plane telemetry of its own (cf. fluxor log_net).
exempt = "telemetry aggregator/collector — aggregates and re-emits other modules MSG_METRIC_SAMPLE into /readyz, /why, /metrics; originates no data-plane telemetry of its own (cf. fluxor log_net)"
