version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "entries"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "read_permits"
direction = "input"
content_type = "OctetStream"

# Per-entry fan-out from raft_engine.log_observe. Same envelope as
# `log_append` — MSG_WAL_ENTRY `[term:u64][index:u64][body...]`.
# Optional; without it the apply_pipeline still emits commit-horizon
# acks on `applied` but the per-entry `committed_entries` stream stays
# silent.
[[ports]]
name = "log_entries"
direction = "input"
content_type = "OctetStream"

# Linearizable read submissions from client_codec. Payload shape:
# MSG_CLIENT_READ_REQUEST `[correlation_id:u64 LE][body...]`. The body
# is opaque — apply_pipeline only blocks until the local apply_index
# has caught up to the commit horizon observed at submission time, and
# the CP read permit is Fresh/Cached. A response with the same
# correlation_id is emitted on `applied` as MSG_CLIENT_READ_RESPONSE.
# Optional; leave unwired in configs that have no read path.
[[ports]]
name = "read"
direction = "input"
content_type = "OctetStream"

# Reply from raft_engine.read_probe_reply for an outstanding strict-
# ReadIndex probe. Payload: `[correlation_id:u64 LE][confirmed_commit:u64
# LE][confirmed:u8]`. Optional — when unwired the read path falls back
# to using the submission-time commit horizon. See RFC §1.3.
[[ports]]
name = "read_probe_reply"
direction = "input"
content_type = "OctetStream"

# WAL random-access reply from `wal.entry_reply` (MSG_WAL_ENTRY_REPLY
# `[request_id:u32][term:u64][index:u64][body...]`). Used by the apply-side
# gap-recovery path: when the lossy `log_observe` fan-out dropped an entry
# body under overdrive, apply_pipeline refetches the missing index from the
# durable WAL via `entry_request` and inserts the reply here so it can keep
# applying in order. Optional; leave unwired for graphs that tolerate the
# best-effort observer stream.
[[ports]]
name = "entry_reply"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "applied"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Largest ack/reject envelope is bounded well below this 64-byte contract.
max_record = 64
rate_class_max = "transaction"
# Internal client ack/reject stream to client_codec. Successful apply
# responses use MSG_CLIENT_RESPONSE with payload
# `[partition_id:u16 LE][term:u64 LE][index:u64 LE]`; client_codec
# strips the partition id before writing the external client response.

# Per-entry committed stream consumed by downstream replicated apps
# (loam, lattice, example_consumer, ...). Envelope:
# MSG_COMMITTED_ENTRY `[term:u64][index:u64][body...]`. Strict
# commit-index order, fail-open on backpressure (consumer recovers
# via snapshot install). See docs/architecture/consumer_facade.md.
[[ports]]
name = "committed_entries"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope (3) + term/index (16) + proposal body (2048).
max_record = 2067
rate_class_max = "transaction"

# Strict-ReadIndex probe request to raft_engine.read_probe_request.
# Payload: `[correlation_id:u64 LE]`. Optional — when unwired the
# read path falls back to using the submission-time commit horizon.
# See RFC §1.3 of the phase-3 plan.
[[ports]]
name = "read_probe_request"
direction = "output"
content_type = "OctetStream"

# Admin entries replicated through Raft (RFC §3.1). Fired when the
# body of a committed entry starts with `ADMIN_MARKER`. Payload:
# `[command_id:u32 LE][op_code:u8][op_body...]`. Wired to
# raft_engine.admin_committed_in so the engine can apply the op
# at commit time on every replica.
[[ports]]
name = "admin_committed"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
max_record = 2051
rate_class_max = "transaction"

# MSG_METRIC_SAMPLE fan-in to telemetry_agg.ingest (RFC §4.3). Appended
# last so applied/committed_entries/read_probe_request/admin_committed
# keep output indices 0-3.
[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

# WAL random-access request to `wal.entry_request` (MSG_WAL_ENTRY_REQUEST
# `[request_id:u32][wal_index:u64]`). Emitted when the in-order apply loop
# hits a gap (the next-needed committed index is missing from the observer
# buffer because the best-effort `log_observe` fan-out dropped it under
# overdrive). The WAL serves the durable entry back on `entry_reply`.
# Appended last so applied/committed_entries/read_probe_request/
# admin_committed/metrics keep output indices 0-4.
[[ports]]
name = "entry_request"
direction = "output"
content_type = "OctetStream"
buffer_size = 8192
# Envelope (3) + request id/index (12).
max_record = 15
rate_class_max = "transaction"

[observability]
# Ordered dedup delivery to the state machine; `[apply] ok` per applied
# entry. Emitted as typed MSG_METRIC_SAMPLE: entries_applied counter,
# queue_depth gauge (§4.2), and the apply_batch_latency_ms histogram
# (§4.1). Partition-stamped for multi-Raft graphs.
metrics = ["entries_applied", "queue_depth", "refetched", "caught_up", "entries_evicted", "reads_evicted"]
histograms = ["apply_batch_latency_ms"]
