version = "0.1.0"
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712"]

[[ports]]
name = "proof"
direction = "input"
content_type = "OctetStream"

[[ports]]
name = "cache_state"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "strict_fallback"
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
direction = "output"
content_type = "OctetStream"

[observability]
# Cache state machine; MetricsPayload to telemetry_agg on each transition.
# cache.state is the Fresh/Cached/Stale/Expired gauge, strict_fallback the
# fallback-trigger counter.
metrics = ["cache.state", "strict_fallback"]
