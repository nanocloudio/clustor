version = "0.1.0"
# Cadence: throttles (metrics heartbeat, time-producer cadence) are
# dev_millis-based, not step-counted — safe on variable-cadence
# domains.
timer_class = "wall_clock"
type = "Transformer"
entry = "mod.rs"
hardware_targets = ["bcm2712", "linux"]

# Session directory / reservation authority — the durable single-writer
# role fluxor's session protocol defines, backed by the replica group, with
# the transport and VIP namespaces beside it. State machines:
# modules/common/{session,transport,vip}_registry.rs; gate tests:
# tests/{session,transport,vip}_registry.rs; doc:
# docs/architecture/session_directory.md.
#
# Capability semantics (fluxor docs/architecture/capability_surface.md,
# Capability Registry; validated under Continuity Validation):
#   session.directory   — single-writer placement/continuity metadata
#   session.reservation — quorum-committed counter-block grants
#   security.key_wrap   — KEK-wrapped key custody the substrate cannot
#                         read, TTL + quorum wipe. The KEK itself lives
#                         with the anchors/HSM, never here.
#   durable.rpo_zero    — replies are relayed only from the committed-
#                         entry stream, so anything acked through this
#                         module is quorum-durable first.
#
# fence.enforceable is deliberately NOT declared: this module enforces
# fence ORDERING (no takeover past a confirmed fence whose generation
# the takeover presents) but cannot cut anything itself. The out-of-band
# fence agent declares it — a member placed outside the failure domain
# whose cut is power or the fabric port.
capabilities = [
  "session.directory",
  "session.reservation",
  "security.key_wrap",
  "durable.rpo_zero",
]

# Capacity profiles: the arenas are compile-time sizes, one variant per
# qualification envelope. The `profile` parameter admits at most the
# variant's arena; a graph asking a smaller variant for a larger profile
# fails init rather than claim it.
#   rp2350 — 64 sessions, 64 flows, 16 VIP bindings (the default)
#   pi5    — 4096 / 4096 / 1024
#   server — 65536 / 65536 / 16384
[[variant]]
name = "rp2350"
features = ["profile-rp2350"]
default = true

[[variant]]
name = "pi5"
features = ["profile-pi5"]

[[variant]]
name = "server"
features = ["profile-server"]

# Committed entries from consensus (strict order).
[[ports]]
name = "committed_entries"
direction = "input"
content_type = "OctetStream"

# MSG_SR_REQUEST / MSG_TR_REQUEST / MSG_VB_REQUEST from anchors /
# orchestrators: [request_id:u64][command body] of the session, transport
# or VIP namespace (the message id names the namespace).
[[ports]]
name = "requests"
index = 1
direction = "input"
content_type = "OctetStream"

# State-machine snapshot install (MSG_APP_SNAPSHOT_CHUNK / RESET).
# Optional; unwired in graphs that don't run snapshot installs.
[[ports]]
name = "snapshot_chunk"
index = 2
direction = "input"
content_type = "OctetStream"

# Snapshot export trigger (MSG_APP_SNAPSHOT_REQUEST). Optional.
[[ports]]
name = "snapshot_request"
index = 3
direction = "input"
content_type = "OctetStream"

# MSG_PROPOSAL_ASSIGNED from consensus: [correlation:8][partition:2]
# [wal_index:8]. Attribution for reply routing — the committed entry at
# `wal_index` is the proposal with that correlation.
[[ports]]
name = "proposal_assigned"
index = 4
direction = "input"
content_type = "OctetStream"

# MSG_LEADER_HINT from consensus ([leader_id:u8][term:u64 LE]) — fences
# the leader-only deterministic-timing producer: only the node that is
# the current PRG leader samples wall time and proposes TimeAdvance /
# TimeDrain entries. Optional; a
# graph without it never produces time (deadlines stay pending).
[[ports]]
name = "leader_state"
index = 5
direction = "input"
content_type = "OctetStream"

# SessionCtrlV1 from anchors: HELLO / ATTACH / EPOCH_BUMP / DETACH — the
# contract's directory verbs (fluxor `contracts/net/session_ctrl.rs`),
# each a replicated command answered after commit. Optional.
[[ports]]
name = "ctrl_in"
index = 6
direction = "input"
content_type = "OctetStream"

# Tagged proposals (MSG_CLIENT_PROPOSAL) to consensus.proposals_tagged.
[[ports]]
name = "proposals"
direction = "output"
content_type = "OctetStream"

# MSG_SR_REPLY / MSG_TR_REPLY / MSG_VB_REPLY back to the requester —
# emitted ONLY after the command is quorum-committed and applied (the ack
# boundary in docs/architecture/session_directory.md).
[[ports]]
name = "replies"
index = 1
direction = "output"
content_type = "OctetStream"

[[ports]]
name = "metrics"
index = 2
direction = "output"
content_type = "OctetStream"

# Snapshot export (MSG_APP_SNAPSHOT_CHUNK, done=1 terminated). Optional.
[[ports]]
name = "snapshot_export"
index = 3
direction = "output"
content_type = "OctetStream"

# SessionCtrlV1 to anchors: ATTACHED / EPOCH_CONFIRMED / DETACHED / ERROR,
# HELLO_ACK, and the reservation grant that follows a committed binding
# (CMD_SC_RESERVATION_GRANT — fluxor's grant record). Optional.
[[ports]]
name = "ctrl_out"
index = 4
direction = "output"
content_type = "OctetStream"

[observability]
# Heartbeat snapshot on `metrics` (MSG_METRICS, ~1s cadence): applied
# cursor plus the six counters below. Per-transition detail is also
# emitted as MON_SESSION log lines.
metrics = [
  "applied_ok",
  "applied_rejected",
  "requests_in",
  "replies_out",
  "stream_gaps",
  "recovery_epoch",
]
# Deterministic-timing series (MSG_METRIC_SAMPLE, source_id 0x19):
# logical time, lag, advance/drain
# totals, live deadlines, due depth, fired/no-op totals, pause reason.
